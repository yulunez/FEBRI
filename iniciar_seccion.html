<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="style.css">
</head>
<body class="body-inicio">
    <div class="envoltorio-sesion">
        
        <form class="caja-sesion">
            <h1 class="titulo-sesion">Iniciar Sesión</h1>
            
            <div class="caja-entrada">
                <label class="etiqueta-entrada">Correo electrónico</label>
                <div class="campo-entrada">
                    <i class='bx bxs-envelope'></i>
                    <input type="email" placeholder="ingrese el correo electrónico" class="entrada-texto">
                </div>
            </div>

            <div class="caja-entrada">
                <label class="etiqueta-entrada">Contraseña</label>
                <div class="campo-entrada">
                    <i class='bx bxs-lock-alt'></i>
                    <input type="password" placeholder="ingrese la contraseña" class="entrada-texto">
                </div>
            </div>

            <div class="botones-accion">
              
                <button type="submit" class="boton-principal">Iniciar Sesión</button>
            </div>

            <div class="enlaces-ayuda">
                <a href="login.html" class="texto-ayuda">¿Aun no te has registrado? <span class="resaltado">Registrarse</span></a>
                <a href="recuperar.html" class="texto-ayuda">¿Olvidaste tu contraseña? <span class="resaltado">Recuperar</span></a>
            </div>
        </form>
    </div>
</body>
</html>
