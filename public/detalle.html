    <!-- Mensaje de carga -->

    <!-- Mensaje de error -->

    <main id="producto-main" style="display: none;">
        <section class="producto-detalle">
            <div class="producto-imagen15">
                <img id="producto-imagen" src="" alt="Producto">
            </div>

            <div class="producto-info">
                <h1 class="producto-tituloa15" id="producto-titulo">Cargando...</h1>
                <div class="producto-precio-fav">
                    <span id="precio-anterior" class="precio-anterior" style="display: none; color: #999; text-decoration: line-through; font-size: 14px; margin-right: 10px;"></span>

                    <button class="btn-favorito" title="Agregar a favoritos">❤</button>
                </div>
                <p class="producto-descripciona15" id="producto-descripcion">Cargando descripción...</p>
                <div class="producto-acciones">
                    <div class="cantidad-carrito">
                        <button class="btn-cantidad" id="restar">-</button>
                        <input type="text" id="cantidad" value="1" readonly>
                        <button class="btn-cantidad" id="sumar">+</button>
                        
                    </div>
                    
                    <button class="btn-agregar-carrito">
                        <span>Comprar ahora</span>
                        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" viewBox="0 0 24 24"><path fill="#fff" d="M7 18c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm10 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zM7.16 14.26l.03.01L7.2 14.3c.27.14.57.2.88.2h7.72c.7 0 1.31-.37 1.62-.93l3.24-5.88A1 1 0 0 0 20 6H6.21l-.94-2H2v2h2l3.6 7.59-1.35 2.44zM17.16 16H7.83l1.1-2h7.45l-1.22 2z"/></svg>
                    </button>
                    
                </div>
                <div class="calificacion">
                    <div class="corazones">
                       <span class="heart" data-index="1">&#10084;</span>
                        <span class="heart" data-index="2">&#10084;</span>
                        <span class="heart" data-index="3">&#10084;</span>
                        <span class="heart" data-index="4">&#10084;</span>
                        <span class="heart" data-index="5">&#10084;</span>

        </section>

        <section class="comentarios">
            <h2>Comentarios</h2>
            <div id="lista-comentarios"></div>
            <form id="form-comentario">
                <textarea id="comentario" placeholder="Escribe tu comentario..." required></textarea>
                <button type="submit">Enviar</button>
            </form>
            
        </section>
    </main>

    <script>
    (function(){
        const loadingDiv = document.getElementById('loading-message');
        const errorDiv = document.getElementById('error-message');
        const mainDiv = document.getElementById('producto-main');

        function obtenerProductoId(){
            return new URLSearchParams(window.location.search).get('producto');
        }

        function mostrarError(){
            loadingDiv.style.display = 'none';
            errorDiv.style.display = 'block';
            mainDiv.style.display = 'none';
        }

        function mostrarProducto(producto){
            loadingDiv.style.display = 'none';
            errorDiv.style.display = 'none';
            mainDiv.style.display = 'block';

            document.getElementById('producto-imagen').src = producto.Imagen || 'imagenes/inicio.webp';
            document.getElementById('producto-imagen').alt = producto.Nombre || producto.nombre || '';
            document.getElementById('producto-titulo').textContent = producto.Nombre || producto.nombre || 'Sin nombre';
            document.getElementById('producto-precio').textContent = (typeof producto.Precio !== 'undefined' && producto.Precio !== null) ? `$ ${producto.Precio}` : '';
            document.getElementById('producto-descripcion').textContent = producto.Descripcion || producto.descripcion || '';

            const precioAnteriorElement = document.getElementById('precio-anterior');
            if (producto.precio_anterior) {
                precioAnteriorElement.textContent = producto.precio_anterior;
                precioAnteriorElement.style.display = 'inline';
            } else {
                precioAnteriorElement.style.display = 'none';
            }

            // inicializar controles
            document.getElementById('restar').onclick = function(){
                const cantidad = document.getElementById('cantidad');
                if (parseInt(cantidad.value) > 1) cantidad.value = parseInt(cantidad.value) - 1;
            };
            document.getElementById('sumar').onclick = function(){
                const cantidad = document.getElementById('cantidad');
                cantidad.value = parseInt(cantidad.value) + 1;
            };
            document.querySelector('.btn-favorito').onclick = function(){ this.classList.toggle('activo'); };

            // cargar comentarios desde localStorage
            cargarComentarios(obtenerProductoId());
        }

        function cargarComentarios(productoId){
            const lista = document.getElementById('lista-comentarios');
            lista.innerHTML = '';
            if (!productoId) return;
            const comentarios = JSON.parse(localStorage.getItem(`comentarios_${productoId}`)) || [];
            comentarios.forEach(c => agregarComentario(c.usuario, c.texto, c.corazones));
        }

        function agregarComentario(usuario, texto, corazonesDado){
            const div = document.createElement('div');
            div.className = 'comentario';
            let corazonesHTML = '';
            for(let i=0;i<corazonesDado;i++) corazonesHTML += '<span class="heart filled">&#10084;</span>';
            for(let i=corazonesDado;i<5;i++) corazonesHTML += '<span class="heart">&#10084;</span>';
            div.innerHTML = `<strong>${usuario}</strong>: ${texto} <br> ${corazonesHTML}`;
            document.getElementById('lista-comentarios').appendChild(div);
        }

        // envío de comentarios (usa el nombre del usuario logueado cuando exista)
        let usuarioNombre = localStorage.getItem('usuarioNombre') || 'Anónimo';

        async function cargarUsuarioActual(){
            try{
                const res = await fetch('/perfilUsuario', { credentials: 'include' });
                if (!res.ok) return; // no logueado o error
                const data = await res.json();
                if (data && data.success && data.usuario) {
                    const nombre = (data.usuario.nombre || '').trim();
                    const apellido = (data.usuario.apellido || '').trim();
                    const fullname = `${nombre} ${apellido}`.trim();
                    if (fullname) {
                        usuarioNombre = fullname;
                        try{ localStorage.setItem('usuarioNombre', usuarioNombre); }catch(e){}
                    }
                }
            }catch(e){
                // ignore, keep Anónimo
            }
        }

        document.getElementById('form-comentario').addEventListener('submit', function(e){
            e.preventDefault();
            const productoId = obtenerProductoId();
            const texto = document.getElementById('comentario').value.trim();
            if (!texto || !productoId) return;
            const existentes = JSON.parse(localStorage.getItem(`comentarios_${productoId}`)) || [];
            const newComment = { usuario: usuarioNombre || 'Anónimo', texto, corazones: 0 };
            existentes.push(newComment);
            localStorage.setItem(`comentarios_${productoId}`, JSON.stringify(existentes));
            agregarComentario(newComment.usuario, newComment.texto, newComment.corazones);
            document.getElementById('comentario').value = '';
        });

        // Load product on DOM ready — primero intentamos cargar el usuario
        document.addEventListener('DOMContentLoaded', async function(){
            await cargarUsuarioActual();
            const productoId = obtenerProductoId();
            if (!productoId) return mostrarError();

            fetch(`/producto/${productoId}`)
                .then(res => res.json())
                .then(data => {
                    if (!data || !data.success || !data.producto) return mostrarError();
                    mostrarProducto(data.producto);
                })
                .catch(err => {
                    console.error('Error al cargar producto:', err);
                    mostrarError();
                });
        });
    })();
    </script>
