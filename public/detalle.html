<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="style.css">
    <script src="shared.js"></script>
</head>
<body>
      <!-- Barra de navegación para pantallas grandes -->
    <nav class="nav-grande">

        <div class="barra-busqueda">

            <i class='bx bx-search'></i>
        </div>
        <div class="menu-items">
            <a href="index.html" class="nav-link">Inicio</a>
            <a href="categorias.html" class="nav-link">Categorías</a>
            <a href="ofertas.html" class="nav-link">Ofertas</a>
            <a href="contactos.html" class="nav-link">Contáctos</a>
            <div class="btn-registrar" id="btn-registrar"><a href="login.html">Iniciar sesión</a></div>

                     <!-- Carrito de compras -->
            <div class="carrito-nav" onclick="irAlCarrito()">
                <i class='bx bx-cart'></i>
                <span class="contador-carrito" id="contador-carrito" style="display: none;">0</span>
            </div>
               <a href="perfil_usuario.html"><i class='bx bx-user perfil-icon'></i></a> 
                
        </div>
        </div>
    </nav>

       <!-- Menú móvil para pantallas pequeñas -->
    <nav class="nav-pequeno">
        <div class="menu-superior">
            <div class="menu-izquierda">
                <i class='bx bx-menu menu-icon'></i>
                <div class="barra-busqueda-movil">
                    <input type="text" placeholder="Buscar productos en Febri...">
                    <i class='bx bx-search'></i>
                </div>
            </div>
            
            <div class="menu-superior-derecha">
              
                 <!-- Carrito de compras -->
            <div class="carrito-nav" onclick="irAlCarrito()">
                <i class='bx bx-cart'></i>
                <span class="contador-carrito" id="contador-carrito" style="display: none;">0</span>
            </div>
               <a href="perfil_usuario.html"><i class='bx bx-user perfil-icon'></i></a> 
                
        </div>
        </div>
        
        <!-- Menú lateral -->
        <div class="menu-lateral">
            <div class="menu-items-movil">
                <a href="index.html" class="nav-link-movil">
                    <i class='bx bx-home-alt'></i>
                    <span>Inicio</span>
                </a>
                <a href="contactos.html" class="nav-link-movil">
                    <i class='bx bx-phone'></i>
                    <span>Contáctos</span>
                </a>
                <a href="categorias.html" class="nav-link-movil">
                    <i class='bx bx-category'></i>
                    <span>Categorías</span>
                </a>
                <a href="ofertas.html" class="nav-link-movil">
                    <i class='bx bx-gift'></i>
                    <span>Ofertas</span>
                </a>
            </div>
        </div>

    <!-- Mensaje de carga -->
    <div id="loading-message" style="text-align: center; padding: 50px; font-size: 18px; color: #666;">
        Cargando producto...
    </div>

    <!-- Mensaje de error -->
    <div id="error-message" style="display: none; text-align: center; padding: 50px; color: #dc3545; font-size: 18px;">
        <h2>Producto no encontrado</h2>
        <p>El producto que buscas no existe o ha sido eliminado.</p>
        <a href="index.html" style="color: #007bff; text-decoration: none;">← Volver al catálogo</a>
    </div>

    <main id="producto-main" style="display: none;">
        <section class="producto-detalle">
            <div class="producto-imagen15">
                <img id="producto-imagen" src="" alt="Producto">
            </div>

            <div class="producto-info">
                <h1 class="producto-tituloa15" id="producto-titulo">Cargando...</h1>
                <div class="producto-precio-fav">
                    <span id="precio-anterior" class="precio-anterior" style="display: none; color: #999; text-decoration: line-through; font-size: 14px; margin-right: 10px;"></span>
                    <span class="producto-precioa15" id="producto-precio">$0</span>
                    <button class="btn-favorito" title="Agregar a favoritos">❤</button>
                </div>
                <p class="producto-descripciona15" id="producto-descripcion">Cargando descripción...</p>
                <div class="producto-acciones">
                    <div class="cantidad-carrito">
                        <button class="btn-cantidad" id="restar">-</button>
                        <input type="text" id="cantidad" value="1" readonly>
                        <button class="btn-cantidad" id="sumar">+</button>
                        
                    </div>
                    
                    <button class="btn-agregar-carrito" onclick="agregarProductoAlCarritoDesdeDetalle()">
                        <span>Comprar ahora</span>
                        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" viewBox="0 0 24 24"><path fill="#fff" d="M7 18c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm10 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zM7.16 14.26l.03.01L7.2 14.3c.27.14.57.2.88.2h7.72c.7 0 1.31-.37 1.62-.93l3.24-5.88A1 1 0 0 0 20 6H6.21l-.94-2H2v2h2l3.6 7.59-1.35 2.44zM17.16 16H7.83l1.1-2h7.45l-1.22 2z"/></svg>
                    </button>
                    
                </div>
                <div class="calificacion">
                    <div class="corazones">
                       <span class="heart" data-index="1">&#10084;</span>
                        <span class="heart" data-index="2">&#10084;</span>
                        <span class="heart" data-index="3">&#10084;</span>
                        <span class="heart" data-index="4">&#10084;</span>
                        <span class="heart" data-index="5">&#10084;</span>
                    </div>
                </div>
        </section>

        <section class="comentarios">
            <h2>Comentarios</h2>
            <div id="lista-comentarios"></div>
            <form id="form-comentario">
                <textarea id="comentario" placeholder="Escribe tu comentario..." required></textarea>
                <button type="submit">Enviar</button>
            </form>
            
        </section>
    </main>

    <script>


 // desplegable menu en pantallas pequeñas
    document.addEventListener('DOMContentLoaded', function() {
        const menuIcon = document.querySelector('.menu-icon');
        const menuLateral = document.querySelector('.menu-lateral');
        
        menuIcon.addEventListener('click', function() {
            menuLateral.classList.toggle('activo');
        });
    });
    // Dentro del IIFE del script de detalle
    (function(){
        const loadingDiv = document.getElementById('loading-message');
        const errorDiv = document.getElementById('error-message');
        const mainDiv = document.getElementById('producto-main');
        // rating actual (se mantiene para el submit de comentarios)
        let calificacionActual = 0;

        function obtenerProductoId(){
            return new URLSearchParams(window.location.search).get('producto');
        }

        function mostrarError(){
            loadingDiv.style.display = 'none';
            errorDiv.style.display = 'block';
            mainDiv.style.display = 'none';
        }

        // variable para mantener el producto actual en el scope del script
        let productoActual = null;

        function mostrarProducto(producto){
            // guardar referencia al producto mostrado para usar al agregar al carrito
            productoActual = producto;
            loadingDiv.style.display = 'none';
            errorDiv.style.display = 'none';
            mainDiv.style.display = 'block';

            document.getElementById('producto-imagen').src = producto.Imagen || 'imagenes/inicio.webp';
            document.getElementById('producto-imagen').alt = producto.Nombre || producto.nombre || '';
            document.getElementById('producto-titulo').textContent = producto.Nombre || producto.nombre || 'Sin nombre';
            document.getElementById('producto-precio').textContent = (typeof producto.Precio !== 'undefined' && producto.Precio !== null) ? `$ ${producto.Precio}` : '';
            document.getElementById('producto-descripcion').textContent = producto.Descripcion || producto.descripcion || '';

            const precioAnteriorElement = document.getElementById('precio-anterior');
            if (producto.precio_anterior) {
                precioAnteriorElement.textContent = producto.precio_anterior;
                precioAnteriorElement.style.display = 'inline';
            } else {
                precioAnteriorElement.style.display = 'none';
            }

            // inicializar controles
            document.getElementById('restar').onclick = function(){
                const cantidad = document.getElementById('cantidad');
                if (parseInt(cantidad.value) > 1) cantidad.value = parseInt(cantidad.value) - 1;
            };
            document.getElementById('sumar').onclick = function(){
                const cantidad = document.getElementById('cantidad');
                cantidad.value = parseInt(cantidad.value) + 1;
            };
            document.querySelector('.btn-favorito').onclick = function(){ this.classList.toggle('activo'); };

            // inicializar calificación (corazones) — reset para este producto
            calificacionActual = 0;
            function actualizarCorazones(rating){
                const hearts = document.querySelectorAll('.corazones .heart');
                hearts.forEach(h => {
                    const idx = parseInt(h.getAttribute('data-index')) || 0;
                    if (idx <= rating) h.classList.add('filled'); else h.classList.remove('filled');
                });
            }
            // attach listeners
            const heartsEls = document.querySelectorAll('.corazones .heart');
            heartsEls.forEach(h => {
                h.onclick = () => {
                    const idx = parseInt(h.getAttribute('data-index')) || 0;
                    calificacionActual = idx;
                    actualizarCorazones(idx);
                };
            });

            // cargar comentarios desde localStorage
            cargarComentarios(obtenerProductoId());
        }

        // Mostrar notificación pequeña cuando se agrega al carrito
        function mostrarNotificacion(mensaje) {
            let notificacion = document.getElementById('notificacion-carrito');
            if (!notificacion) {
                notificacion = document.createElement('div');
                notificacion.id = 'notificacion-carrito';
                notificacion.style.cssText = `position: fixed; top: 20px; right: 20px; background: rgba(16,185,129,0.95); color: white; padding: 0.8rem 1.2rem; border-radius: 8px; z-index: 10000; transform: translateX(120%); transition: transform 0.25s ease; font-weight:600;`;
                document.body.appendChild(notificacion);
            }
            notificacion.textContent = mensaje;
            // mostrar
            requestAnimationFrame(() => { notificacion.style.transform = 'translateX(0)'; });
            // ocultar
            setTimeout(() => { notificacion.style.transform = 'translateX(120%)'; }, 2000);
        }

        // Añadir el producto actual al carrito (sessionStorage)
        function agregarProductoAlCarritoDesdeDetalle() {
            // Bloqueo si no hay sesión
            const usuarioLogueado = localStorage.getItem('usuarioLogueado') === 'true';
            if (!usuarioLogueado) {
                window.location.href = 'login.html';
                return;
            }

            if (!productoActual) return mostrarNotificacion('Producto no cargado');
            const cantidadInput = document.getElementById('cantidad');
            let cantidad = parseInt(cantidadInput && cantidadInput.value, 10) || 1;
            if (cantidad < 1) cantidad = 1;

            // Construir objeto básico que compartimos con el resto de la app
            const item = {
                id: productoActual.ID_producto || productoActual.id || productoActual.ID || null,
                nombre: productoActual.Nombre || productoActual.nombre || '',
                precio: (typeof productoActual.Precio !== 'undefined' && productoActual.Precio !== null) ? Number(productoActual.Precio) : (productoActual.precio || 0),
                descripcion: productoActual.Descripcion || productoActual.descripcion || '',
                imagen: productoActual.Imagen || productoActual.imagen || 'imagenes/inicio.webp',
                cantidad: cantidad
            };

            if (!item.id) {
                return mostrarNotificacion('ID de producto no disponible');
            }

            const carrito = JSON.parse(sessionStorage.getItem('carritoCompra')) || [];
            const existente = carrito.find(p => Number(p.id) === Number(item.id));
            if (existente) {
                existente.cantidad = (parseInt(existente.cantidad, 10) || 0) + item.cantidad;
            } else {
                carrito.push(item);
            }
            sessionStorage.setItem('carritoCompra', JSON.stringify(carrito));
            mostrarNotificacion(`${item.nombre} agregado al carrito`);
            actualizarContadorCarrito();
        }

        // Actualizar contador del carrito en la barra (lee sessionStorage)
        function actualizarContadorCarrito() {
            const carrito = JSON.parse(sessionStorage.getItem('carritoCompra')) || [];
            const totalItems = carrito.reduce((t, it) => t + (parseInt(it.cantidad, 10) || 0), 0);
            const contador = document.getElementById('contador-carrito');
            if (contador) {
                contador.textContent = totalItems;
                contador.style.display = totalItems > 0 ? 'flex' : 'none';
            }
            const contadorMovil = document.getElementById('contador-carrito-movil');
            if (contadorMovil) {
                contadorMovil.textContent = totalItems;
                contadorMovil.style.display = totalItems > 0 ? 'flex' : 'none';
            }
        }

        function cargarComentarios(productoId){
            const lista = document.getElementById('lista-comentarios');
            lista.innerHTML = '';
            if (!productoId) return;
            const comentarios = JSON.parse(localStorage.getItem(`comentarios_${productoId}`)) || [];
            comentarios.forEach(c => agregarComentario(c.usuario, c.texto, c.corazones));
        }

        function agregarComentario(usuario, texto, corazonesDado){
            const div = document.createElement('div');
            div.className = 'comentario';
            let corazonesHTML = '';
            for(let i=0;i<corazonesDado;i++) corazonesHTML += '<span class="heart filled">&#10084;</span>';
            for(let i=corazonesDado;i<5;i++) corazonesHTML += '<span class="heart">&#10084;</span>';
            div.innerHTML = `<strong>${usuario}</strong>: ${texto} <br> ${corazonesHTML}`;
            document.getElementById('lista-comentarios').appendChild(div);
        }

        // envío de comentarios (usa el nombre del usuario logueado cuando exista)
        // Antes: let usuarioNombre = localStorage.getItem('usuarioNombre') || 'Anónimo';
        let usuarioNombre = 'Anónimo';
        const usuarioLogueado = localStorage.getItem('usuarioLogueado') === 'true';
        if (usuarioLogueado) {
            const nombreGuardado = localStorage.getItem('usuarioNombre');
            if (nombreGuardado) usuarioNombre = nombreGuardado;
        } else {
            try { localStorage.removeItem('usuarioNombre'); } catch(e) {}
        }

        // Al inicio del script, ocultar “Registrar” si ya hay login en localStorage
        document.addEventListener('DOMContentLoaded', function() {
            const btnRegistrar = document.getElementById('btn-registrar');
            if (btnRegistrar && localStorage.getItem('usuarioLogueado') === 'true') {
                btnRegistrar.style.display = 'none';
            }
        });

        async function cargarUsuarioActual(){
            try{
                const res = await fetch('/perfil-usuario', { credentials: 'include' });
                if (!res.ok) return;
                const data = await res.json();
                if (data && data.success && data.usuario) {
                    const nombre = (data.usuario.nombre || '').trim();
                    const apellido = (data.usuario.apellido || '').trim();
                    const fullname = `${nombre} ${apellido}`.trim();
                    if (fullname) {
                        usuarioNombre = fullname;
                        try { localStorage.setItem('usuarioNombre', usuarioNombre); } catch(e) {}
                        const btnRegistrar = document.getElementById('btn-registrar');
                        if (btnRegistrar) btnRegistrar.style.display = 'none';
                    }
                }
            } catch(err){
               
            }
        }

        document.getElementById('form-comentario').addEventListener('submit', function(e){
            e.preventDefault();

            // Bloqueo si no hay sesión
            const usuarioLogueado = localStorage.getItem('usuarioLogueado') === 'true';
            if (!usuarioLogueado) {
                window.location.href = 'login.html';
                return;
            }

            const productoId = obtenerProductoId();
            const texto = document.getElementById('comentario').value.trim();
            if (!texto || !productoId) return;
            const existentes = JSON.parse(localStorage.getItem(`comentarios_${productoId}`)) || [];
            // Guardar la calificación seleccionada (calificacionActual)
            const newComment = { usuario: usuarioNombre || 'Anónimo', texto, corazones: calificacionActual || 0 };
            existentes.push(newComment);
            localStorage.setItem(`comentarios_${productoId}`, JSON.stringify(existentes));
            agregarComentario(newComment.usuario, newComment.texto, newComment.corazones);
            document.getElementById('comentario').value = '';
            // Reset visual de la calificación para el siguiente comentario
            calificacionActual = 0;
            document.querySelectorAll('.corazones .heart').forEach(h => h.classList.remove('filled'));
        });

        // Load product on DOM ready — primero intentamos cargar el usuario
        document.addEventListener('DOMContentLoaded', async function(){
            await cargarUsuarioActual();
            const productoId = obtenerProductoId();
            if (!productoId) return mostrarError();

            fetch(`/productos/${productoId}`)
                .then(res => res.json())
                .then(data => {
                    if (!data || !data.success || !data.producto) return mostrarError();
                    mostrarProducto(data.producto);
                })
                .catch(err => {
                    console.error('Error al cargar producto:', err);
                    mostrarError();
                });
            // actualizar contador al cargar la página
            actualizarContadorCarrito();
        });
        // Exponer funciones al scope global para que los handlers inline (onclick="...") las puedan invocar
        // (Las funciones están definidas dentro del IIFE, por eso las hacemos accesibles en window)
        try{
            window.agregarProductoAlCarritoDesdeDetalle = agregarProductoAlCarritoDesdeDetalle;
            window.actualizarContadorCarrito = actualizarContadorCarrito;
        }catch(e){
            // noop
        }
    })();
        function irAlCarrito() {
        window.location.href = 'carrito_compra.html';
    }
    </script>
    <script>
    (function(){
        // Alterna login vs perfil según sesión (afecta nav grande y móvil)
        function toggleLoginVsProfile() {
            const loggedIn = localStorage.getItem('usuarioLogueado') === 'true';
            // Mostrar/ocultar todos los iconos de perfil
            document.querySelectorAll('.perfil-icon').forEach(el => {
                el.style.display = loggedIn ? 'inline' : 'none';
            });
            // Mostrar/ocultar el botón "Iniciar sesión"
            const btnRegistrar = document.getElementById('btn-registrar');
            if (btnRegistrar) btnRegistrar.style.display = loggedIn ? 'none' : 'block';
        }

        document.addEventListener('DOMContentLoaded', function() {
            toggleLoginVsProfile(); // asegura que el perfil no aparezca si no hay sesión
        });

        // Reaccionar si la sesión cambia en otra pestaña
        window.addEventListener('storage', function(e) {
            if (!e || e.key === 'usuarioLogueado') toggleLoginVsProfile();
        });
    })();
    </script>
