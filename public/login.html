<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro Responsivo</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="style.css">
</head>
<body class="body-inicio" >
    <div class="contenedor">
        <form class="formulario-registro">
            <div class="avatar">
                <i class='bx bxs-user-circle'></i>
            </div>
            
            <div class="fila-formulario">
                <input type="text" placeholder="Nombre" class="entrada-mitad">
                <input type="text" placeholder="Apellidos" class="entrada-mitad">
            </div>

            <div class="grupo-formulario">
                <div class="contenedor-icono">
                    <i class='bx bxs-calendar'></i>
                    <input type="date" class="control-formulario">
                </div>
            </div>

            <div class="grupo-formulario">
                <div class="contenedor-icono">
                    <i class='bx bxs-map'></i>
                    <input type="text" placeholder="Ingrese su dirección" class="control-formulario">
                </div>
            </div>

            <div class="grupo-formulario">
                <div class="contenedor-icono">
                    <i class='bx bxs-envelope'></i>
                    <input type="email" placeholder="Ingresar correo electronico" class="control-formulario">
                </div>
            </div>

            <div class="grupo-formulario">
                <div class="contenedor-icono">
                    <i class='bx bxs-phone'></i>
                    <input type="tel" placeholder="ingresar telefono" class="control-formulario">
                </div>
            </div>

            <div class="grupo-formulario">
                <div class="contenedor-icono">
                    <i class='bx bxs-lock-alt'></i>
                    <input type="password" placeholder="ingresar contraseña" class="control-formulario">
                </div>
            </div>

            <div class="grupo-formulario">
                <div class="contenedor-icono">
                    <i class='bx bxs-lock-alt'></i>
                    <input type="password" placeholder="Confirmar contraseña" class="control-formulario">
                </div>
            </div>

            <button type="submit" class="boton-registrar">Registrar</button>
        </form>
    </div>
    
</body>
</html>
