<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultados de Búsqueda - Febri</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="busqueda.css">
    <!-- Reemplazar el kit que da 403 por CDN de Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
    <!-- Barra de navegación para pantallas grandes -->
    <nav class="nav-grande">
        <div class="logo">
            <a href="index.html">
                <img src="imagenes/logo.png" alt="Logo">
            </a>
        </div>
        <div class="barra-busqueda">
            <input type="text" id="busqueda-input" placeholder="Buscar productos en Febri...">
            <i class='bx bx-search' id="busqueda-btn" onclick="realizarBusqueda()"></i>
        </div>
        <div class="menu-items">
            <a href="index.html" class="nav-link">Inicio</a>
            <a href="categorias.html" class="nav-link">Categorías</a>
            <a href="ofertas.html" class="nav-link">Ofertas</a>
            <a href="contactos.html" class="nav-link">Contáctos</a>
            <div class="btn-registrar" id="btn-iniciar-sesion"><a href="login.html">Iniciar sesión</a></div>
            <div class="carrito-nav" onclick="irAlCarrito()">
                <i class='bx bx-cart'></i>
                <span class="contador-carrito" id="contador-carrito" style="display: none;">0</span>
            </div>  
            <a href="perfil_usuario.html" id="perfil-link"><i class='bx bx-user perfil-icon'></i></a>
        </div>
    </nav>

    <!-- Menú móvil -->
    <nav class="nav-pequeno">
        <div class="menu-superior">
            <div class="menu-izquierda">
                <i class='bx bx-menu menu-icon'></i>
                <div class="barra-busqueda-movil">
                    <input type="text" id="busqueda-input-movil" placeholder="Buscar productos en Febri...">
                    <i class='bx bx-search' id="busqueda-btn-movil" onclick="realizarBusquedaMovil()"></i>
                </div>
            </div>
            <div class="menu-superior-derecha">
                <div class="carrito-nav" onclick="irAlCarrito()">
                    <i class='bx bx-cart'></i>
                    <span class="contador-carrito" id="contador-carrito-movil" style="display: none;">0</span>
                </div>
                <a href="perfil_usuario.html"><i class='bx bx-user perfil-icon'></i></a>
            </div>
        </div>
        <div class="menu-lateral">
            <div class="menu-items-movil">
                <a href="index.html" class="nav-link-movil">
                    <i class='bx bx-home-alt'></i>
                    <span>Inicio</span>
                </a>
                <a href="contactos.html" class="nav-link-movil">
                    <i class='bx bx-phone'></i>
                    <span>Contáctos</span>
                </a>
                <a href="categorias.html" class="nav-link-movil">
                    <i class='bx bx-category'></i>
                    <span>Categorías</span>
                </a>
                <a href="ofertas.html" class="nav-link-movil">
                    <i class='bx bx-gift'></i>
                    <span>Ofertas</span>
                </a>
            </div>
        </div>
    </nav>

    <!-- Contenido principal -->
    <section class="productos-categoria">
        <div class="contenedor-productos-hogar" id="contenedor-productos">
            <!-- Aquí se cargarán los resultados -->
        </div>
    </section>

    <!-- Eliminar esta línea que genera 403 -->
    <!-- <script src="https://kit.fontawesome.com/eb496ab1a0.js" crossorigin="anonymous"></script> -->
    <script>
        // Función para obtener parámetros de la URL
        function obtenerParametroURL(nombre) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(nombre);
        }
        
        // Función para realizar búsqueda
        function realizarBusqueda() {
            const termino = document.getElementById('busqueda-input').value.trim();
            if (termino) {
                window.location.href = `busqueda.html?termino=${encodeURIComponent(termino)}`;
            }
        }
        
        // Función para realizar búsqueda móvil
        function realizarBusquedaMovil() {
            const termino = document.getElementById('busqueda-input-movil').value.trim();
            if (termino) {
                window.location.href = `busqueda.html?termino=${encodeURIComponent(termino)}`;
            }
        }
        
        // Función para cargar resultados
        async function cargarResultados() {
            const termino = obtenerParametroURL('termino');
            
            if (!termino || termino.trim() === '') {
                return; // Sin mensaje, solo no cargar nada
            }
            
            // Actualizar campos de búsqueda
            document.getElementById('busqueda-input').value = termino;
            document.getElementById('busqueda-input-movil').value = termino;
            
            console.log(' Buscando:', termino);
            
            try {
                const response = await fetch(`/productos/buscar?termino=${encodeURIComponent(termino)}`);
                
                console.log(' Status:', response.status);
                
                if (!response.ok) {
                    throw new Error(`Error HTTP: ${response.status}`);
                }
                
                const data = await response.json();
                console.log(' Datos recibidos:', data);
                
                const contenedor = document.getElementById('contenedor-productos');
                
                
                if (data.success && Array.isArray(data.productos) && data.productos.length > 0) {
                    // Mapear resultados para usar al agregar al carrito
                    productosBusqueda = data.productos.map(p => ({
                        id: p.id,
                        nombre: p.Nombre || p.nombre || 'Producto',
                        precio: Number(p.Precio) || 0,
                        imagen: p.Imagen || p.imagen || 'imagenes/inicio.webp',
                        descripcion: p.Descripcion || p.descripcion || ''
                    }));
                    // HAY PRODUCTOS - usar el mismo diseño que las categorías
                    contenedor.innerHTML = '';
                    
                    data.productos.forEach(producto => {
                        const precio = Number(producto.Precio) || 0;
                        const precioOriginal = Number(producto.PrecioAnterior) || null;
                        
                        // Determinar cómo mostrar los precios (igual que en categorías)
                        let preciosHTML;
                        if (precioOriginal && precioOriginal > precio) {
                            preciosHTML = `
                                <span class="precio-descuento-hogar">${precioOriginal.toLocaleString()}</span>
                                <span class="precio-original-hogar">${precio.toLocaleString()}</span>
                            `;
                        } else {
                            preciosHTML = `<span class="precio-original-hogar">${precio.toLocaleString()}</span>`;
                        }
                        
                        const cardHTML = `
                            <div class="producto-card-hogar">
                                <div class="producto-imagen-hogar">
                                    <a href="detalle.html?producto=${encodeURIComponent(producto.id)}">
                                        <img src="${producto.Imagen || 'imagenes/inicio.webp'}" alt="${producto.Nombre || 'Producto'}">
                                    </a>
                                    <button class="btn-agregar" onclick="agregarAlCarrito(${producto.id})">
                                        <i class='bx bx-cart-add'></i>
                                        Agregar al carrito
                                    </button>
                                </div>
                                <div class="producto-info-hogar">
                                    <h3 class="producto-nombre-hogar">
                                        <a href="detalle.html?producto=${encodeURIComponent(producto.id)}" style="color:inherit; text-decoration:none;">${producto.Nombre || 'Producto'}</a>
                                    </h3>
                                    <div class="producto-precios-hogar">
                                        ${preciosHTML}
                                    </div>
                                    <button class="btn-favorito">
                                        <i class='bx bx-heart'></i>
                                    </button>
                                </div>
                            </div>
                        `;
                        
                        contenedor.innerHTML += cardHTML;
                    });
                    
                    // Agregar funcionalidad a los botones de favoritos
                    agregarFuncionalidadFavoritos();
                } else {
                    // NO HAY PRODUCTOS - mostrar mensaje + botón ver categorías
                    const contenedor = document.getElementById('contenedor-productos');
                    if (contenedor) {
                        contenedor.innerHTML = `
                            <div class="no-resultados" style="grid-column: 1 / -1; text-align: center; padding: 24px;">
                                <h3 style="margin-bottom: 8px;">No se encontraron productos</h3>
                                <p style="margin-bottom: 16px;">
                                    No hay resultados para "${termino}". Intenta otra búsqueda o explora nuestras categorías.
                                </p>
                                <a href="categorias.html" class="btn-volver"
                                   style="display: inline-block; background: #ff7eb3; color: #fff; padding: 10px 16px; border-radius: 8px; text-decoration: none;">
                                   Ver Categorías
                                </a>
                            </div>
                        `;
                    }
                }
            } catch (error) {
                console.error(' Error:', error);
                // Sin mensaje de error, solo limpiar contenedor
                const contenedor = document.getElementById('contenedor-productos');
                if (contenedor) contenedor.innerHTML = '';
            }
        }
        
        // Función para agregar funcionalidad a los botones de favoritos (igual que en categorías)
        function agregarFuncionalidadFavoritos() {
            const botonesFavoritos = document.querySelectorAll('.btn-favorito');
            botonesFavoritos.forEach(boton => {
                boton.addEventListener('click', function() {
                    this.classList.toggle('activo');
                });
            });
        }
        
        // Función para agregar al carrito (igual que en categorías)
        function agregarAlCarrito(productoId) {
            if (localStorage.getItem('usuarioLogueado') !== 'true') {
                alert('Debes iniciar sesión para agregar productos al carrito');
                window.location.href = 'login.html';
                return;
            }

            try {
                let carrito = JSON.parse(sessionStorage.getItem('carritoCompra')) || [];
                const productoExistente = carrito.find(item => item.id === productoId);
                
                if (productoExistente) {
                    productoExistente.cantidad += 1;
                } else {
                    // Buscar el producto completo en los resultados de búsqueda
                    const producto = productosBusqueda.find(p => p.id === productoId);
                    if (producto) {
                        carrito.push({
                            id: producto.id,
                            nombre: producto.nombre,
                            precio: Number(producto.precio) || 0,
                            descripcion: producto.descripcion || '',
                            imagen: producto.imagen || 'imagenes/inicio.webp',
                            cantidad: 1
                        });
                    } else {
                        // Fallback para no romper en casos edge
                        carrito.push({ id: productoId, cantidad: 1 });
                    }
                }
        
                // Guardar en ambas para compatibilidad con otras páginas
                sessionStorage.setItem('carritoCompra', JSON.stringify(carrito));
                localStorage.setItem('carritoCompra', JSON.stringify(carrito));
        
                // Actualizar contador del carrito
                updateCartCounters();
                alert('✅ Producto agregado al carrito');
            } catch (error) {
                console.error('Error al agregar al carrito:', error);
                alert('❌ Error al agregar el producto al carrito');
            }
        }
        
        // Función para ir al carrito
        function irAlCarrito() {
            window.location.href = 'carrito_compra.html';
        }
        
        // Configurar eventos
        document.addEventListener('DOMContentLoaded', function() {
            // Cargar resultados
            cargarResultados();
            
            // Eventos de búsqueda con Enter
            document.getElementById('busqueda-input').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') realizarBusqueda();
            });
            
            document.getElementById('busqueda-input-movil').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') realizarBusquedaMovil();
            });
            
            // Menú lateral móvil
            const menuIcon = document.querySelector('.menu-icon');
            const menuLateral = document.querySelector('.menu-lateral');
            
            if (menuIcon && menuLateral) {
                menuIcon.addEventListener('click', function() {
                    menuLateral.classList.toggle('activo');
                });
            }
        });
        
        // Funciones de navegación y carrito (iguales que en categorías)
        function isLoggedIn() { 
            try { 
                return localStorage.getItem('usuarioLogueado') === 'true'; 
            } catch { 
                return false; 
            } 
        }
        
        function toggleLoginVsProfile() {
            const logged = isLoggedIn();
            const btnLogin = document.querySelector('.btn-registrar');
            const btnLoginMovil = document.querySelector('.btn-registrar-movil');
            const perfilIcon = document.querySelector('.perfil-icon');
            if (btnLogin) btnLogin.style.display = logged ? 'none' : 'block';
            if (btnLoginMovil) btnLoginMovil.style.display = logged ? 'none' : 'block';
            if (perfilIcon) perfilIcon.style.display = logged ? 'inline-block' : 'none';
        }
        
        function getCartItems() {
            try {
                return JSON.parse(sessionStorage.getItem('carritoCompra')) || [];
            } catch {
                return [];
            }
        }
        
        function updateCartCounters() {
            const total = getCartItems().reduce((sum, item) => sum + (Number(item.cantidad) || 0), 0);
            document.querySelectorAll('.contador-carrito').forEach(el => {
                el.textContent = String(total);
                el.style.display = total > 0 ? 'flex' : 'none';
            });
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            cargarResultados();
            toggleLoginVsProfile();
            updateCartCounters();
        });
        
        // Memoria de resultados para el carrito
        let productosBusqueda = [];
    </script>
</body>
</html>
