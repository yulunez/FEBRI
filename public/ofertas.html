<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ofertas Especiales - Productos de Resina</title>
    <link rel="stylesheet" href="style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <script src="shared.js"></script>
    <style>
        :root {
            --rosa-marca: #f8a4d8;
        }
    </style>
</head>
<body>
    <!-- Barra de navegación para pantallas grandes -->
    <nav class="nav-grande">
        <div class="logo">
            <img src="imagenes/logo.png" alt="Logo">
        </div>
        <div class="barra-busqueda">
            <input type="text" placeholder="Buscar productos en Febri...">
            <i class='bx bx-search'></i>
        </div>
        <div class="menu-items">
            <a href="index.html" class="nav-link">Inicio</a>
            <a href="categorias.html" class="nav-link">Categorías</a>
            <a href="ofertas.html" class="nav-link">Ofertas</a>
            <a href="contactos.html" class="nav-link">Contáctos</a>
            <div class="btn-registrar"><a href="login.html">Iniciar sesión</a></div>

            <!-- Carrito de compras -->
            <div class="carrito-nav" onclick="irAlCarrito()">
                <i class='bx bx-cart'></i>
                <span class="contador-carrito" id="contador-carrito" style="display: none;">0</span>
            </div>
            <a href="perfil_usuario.html"><i class='bx bx-user perfil-icon'></i></a>
        </div>
    </nav>

    <!-- Menú móvil para pantallas pequeñas -->
    <nav class="nav-pequeno">
        <div class="menu-superior">
            <div class="menu-izquierda">
                <i class='bx bx-menu menu-icon'></i>
                <div class="barra-busqueda-movil">
                    <input type="text" placeholder="Buscar...">
                    <i class='bx bx-search'></i>
                </div>
            </div>
            
            <div class="menu-superior-derecha">
                <div class="btn-registrar-movil">
                    <a href="login.html">Iniciar</a>
                </div>
                <div class="carrito-nav" onclick="irAlCarrito()">
                    <i class='bx bx-cart'></i>
                    <span class="contador-carrito" id="contador-carrito-movil" style="display: none;">0</span>
                </div>
                <a href="perfil_usuario.html"><i class='bx bx-user perfil-icon'></i></a>
            </div>
        </div>
        
        <!-- Menú lateral -->
        <div class="menu-lateral">
            <div class="menu-items-movil">
                <a href="index.html" class="nav-link-movil">Inicio</a>
                <a href="categorias.html" class="nav-link-movil">Categorías</a>
                <a href="ofertas.html" class="nav-link-movil">Ofertas</a>
                <a href="contactos.html" class="nav-link-movil">Contáctos</a>
            </div>
        </div>
    </nav>

    <section class="ofertas-seccion">
        <h2 class="ofertas-titulo">🔥 Ofertas Irresistibles 🔥</h2>
        <div class="ofertas-contenedor" id="ofertas-contenedor">
            <!-- Los productos se cargarán dinámicamente -->
        </div>
    </section>

    <script>
        // Cargar productos en oferta desde el backend
        async function cargarProductosEnOferta() {
            try {
                const response = await fetch('/producto/ofertas');
                if (!response.ok) {
                    throw new Error('Error al cargar las ofertas');
                }
                const data = await response.json();
                if (!data.success || !Array.isArray(data.productos)) {
                    return [];
                }

                return data.productos.map(p => {
                    const precioOriginal = p.precio_normal || p.Precio;
                    const precioConDescuento = p.descuento ? precioOriginal * (1 - p.descuento/100) : precioOriginal;
                    
                    return {
                        id: p.id || p.ID_producto,
                        nombre: p.Nombre,
                        imagen: p.Imagen || p.imagen,
                        precio: precioConDescuento,
                        precio_normal: precioOriginal,
                        descuento: p.descuento,
                        descripcion: p.Descripcion
                    };
                });
            } catch (error) {
                console.error('Error al cargar productos:', error);
                return [];
            }
        }

        // Renderizar productos de ofertas
        async function renderizarOfertas() {
            const contenedor = document.getElementById('ofertas-contenedor');
            contenedor.innerHTML = '<div class="loading">Cargando ofertas...</div>';
            
            try {
                const productos = await cargarProductosEnOferta();
                if (productos.length === 0) {
                    contenedor.innerHTML = '<div class="no-ofertas">No hay ofertas disponibles en este momento</div>';
                    return;
                }

                contenedor.innerHTML = productos.map(producto => `
                    <div class="oferta-card" data-id="${producto.id}">
                        <div class="oferta-imagen">
                            <img src="${producto.imagen}" alt="${producto.nombre}">
                            <div class="descuento-badge">-${producto.descuento}%</div>
                        </div>
                        <div class="oferta-info">
                            <h3>${producto.nombre}</h3>
                            <p class="descripcion">${producto.descripcion || ''}</p>
                            <div class="precio-container">
                                <span class="precio-anterior">$${formatearPrecio(producto.precio_normal)}</span>
                                <span class="precio-actual">$${formatearPrecio(producto.precio)}</span>
                            </div>
                            <button class="btn-agregar" onclick="agregarAlCarrito(${producto.id})">
                                Agregar al carrito <i class='bx bx-cart-add'></i>
                            </button>
                        </div>
                    </div>
                `).join('');

                // Agregar estilos para las ofertas
                if (!document.getElementById('estilos-ofertas')) {
                    const style = document.createElement('style');
                    style.id = 'estilos-ofertas';
                    style.textContent = `
                        .ofertas-contenedor {
                            display: grid;
                            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
                            gap: 20px;
                            padding: 20px;
                        }
                        .oferta-card {
                            border: 1px solid #ddd;
                            border-radius: 8px;
                            overflow: hidden;
                            transition: transform 0.3s ease;
                            background: white;
                            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
                        }
                        .oferta-card:hover {
                            transform: translateY(-5px);
                        }
                        .oferta-imagen {
                            position: relative;
                            padding-top: 75%;
                            overflow: hidden;
                        }
                        .oferta-imagen img {
                            position: absolute;
                            top: 0;
                            left: 0;
                            width: 100%;
                            height: 100%;
                            object-fit: cover;
                        }
                        .descuento-badge {
                            position: absolute;
                            top: 10px;
                            right: 10px;
                            background: var(--rosa-marca);
                            color: white;
                            padding: 5px 10px;
                            border-radius: 20px;
                            font-weight: bold;
                        }
                        .oferta-info {
                            padding: 15px;
                        }
                        .oferta-info h3 {
                            margin: 0 0 10px;
                            font-size: 1.1em;
                        }
                        .descripcion {
                            font-size: 0.9em;
                            color: #666;
                            margin-bottom: 10px;
                            display: -webkit-box;
                            -webkit-line-clamp: 2;
                            -webkit-box-orient: vertical;
                            overflow: hidden;
                        }
                        .precio-container {
                            display: flex;
                            align-items: center;
                            gap: 10px;
                            margin-bottom: 15px;
                        }
                        .precio-anterior {
                            text-decoration: line-through;
                            color: #999;
                            font-size: 0.9em;
                        }
                        .precio-actual {
                            color: var(--rosa-marca);
                            font-size: 1.2em;
                            font-weight: bold;
                        }
                        .btn-agregar {
                            width: 100%;
                            padding: 10px;
                            background: #4CAF50;
                            color: white;
                            border: none;
                            border-radius: 5px;
                            cursor: pointer;
                            display: flex;
                            align-items: center;
                            justify-content: center;
                            gap: 8px;
                            transition: background 0.3s ease;
                        }
                        .btn-agregar:hover {
                            background: #45a049;
                        }
                        .loading, .no-ofertas {
                            text-align: center;
                            padding: 20px;
                            font-size: 1.2em;
                            color: #666;
                        }
                    `;
                    document.head.appendChild(style);
                }
            } catch (error) {
                console.error('Error al renderizar ofertas:', error);
                contenedor.innerHTML = '<div class="error">Error al cargar las ofertas</div>';
            }
        }

        // Formatear precio en pesos colombianos
        function formatearPrecio(precio) {
            return new Intl.NumberFormat('es-CO', {
                style: 'decimal',
                minimumFractionDigits: 0
            }).format(precio);
        }

        // Función para agregar producto al carrito
        async function agregarAlCarrito(productoId) {
            if (localStorage.getItem('usuarioLogueado') !== 'true') {
                window.location.href = 'login.html';
                return;
            }

            try {
                const response = await fetch(`/producto/${productoId}`);
                if (!response.ok) {
                    throw new Error('Error al obtener detalles del producto');
                }
                const data = await response.json();
                if (!data.success || !data.producto) {
                    throw new Error('Producto no encontrado');
                }

                const producto = data.producto;
                
                // Obtener carrito actual
                let carrito = JSON.parse(sessionStorage.getItem('carritoCompra')) || [];
                
                // Verificar si el producto ya está en el carrito
                const productoExistente = carrito.find(item => item.id === productoId);
                
                if (productoExistente) {
                    productoExistente.cantidad = (productoExistente.cantidad || 1) + 1;
                    // Asegurarse de que el precio está actualizado con el descuento
                    if (producto.descuento) {
                        const precioOriginal = producto.Precio;
                        const precioConDescuento = precioOriginal * (1 - producto.descuento/100);
                        productoExistente.precio = precioConDescuento;
                        productoExistente.precio_normal = precioOriginal;
                        productoExistente.descuento = producto.descuento;
                    }
                    mostrarNotificacion(`Se agregó otra unidad de ${producto.Nombre} al carrito`);
                } else {
                    // Agregar nuevo producto al carrito
                    const precioOriginal = producto.Precio;
                    const precioConDescuento = producto.descuento ? precioOriginal * (1 - producto.descuento/100) : precioOriginal;
                    carrito.push({
                        id: producto.id,
                        nombre: producto.Nombre,
                        precio: precioConDescuento, // Precio con descuento calculado
                        precio_normal: precioOriginal, // Guardamos el precio original también
                        imagen: producto.Imagen,
                        cantidad: 1,
                        descuento: producto.descuento
                    });
                    mostrarNotificacion(`${producto.Nombre} agregado al carrito`);
                }
                
                // Guardar carrito actualizado
                sessionStorage.setItem('carritoCompra', JSON.stringify(carrito));
                
                // Actualizar contador del carrito
                actualizarContadorCarrito();
            } catch (error) {
                console.error('Error al agregar al carrito:', error);
                mostrarNotificacion('Error al agregar el producto al carrito');
            }
        }

        // Función para mostrar notificación
        function mostrarNotificacion(mensaje) {
            let notificacion = document.getElementById('notificacion-carrito');
            if (!notificacion) {
                notificacion = document.createElement('div');
                notificacion.id = 'notificacion-carrito';
                notificacion.style.cssText = `
                    position: fixed;
                    right: -300px;
                    top: 20px;
                    background: #4CAF50;
                    color: white;
                    padding: 15px 20px;
                    border-radius: 5px;
                    transition: transform 0.3s ease;
                    z-index: 1000;
                    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
                `;
                document.body.appendChild(notificacion);
            }
            
            notificacion.textContent = mensaje;
            notificacion.style.transform = 'translateX(-320px)';
            
            setTimeout(() => {
                notificacion.style.transform = 'translateX(0)';
            }, 3000);
        }

        // Función para actualizar contador del carrito
        function actualizarContadorCarrito() {
            const carrito = JSON.parse(sessionStorage.getItem('carritoCompra')) || [];
            const totalItems = carrito.reduce((total, item) => total + (Number(item.cantidad) || 1), 0);
            
            document.querySelectorAll('.contador-carrito').forEach(contador => {
                contador.textContent = totalItems;
                contador.style.display = totalItems > 0 ? 'flex' : 'none';
            });
        }
        
        // Función para ir al carrito
        function irAlCarrito() {
            window.location.href = 'carrito_compra.html';
        }

        // Inicializar cuando carga la página
        document.addEventListener('DOMContentLoaded', function() {
            const btnLogin = document.querySelector('.btn-registrar');
            const btnLoginMovil = document.querySelector('.btn-registrar-movil');
            const perfilIcon = document.querySelector('.perfil-icon');
            
            if (localStorage.getItem('usuarioLogueado') === 'true') {
                if (btnLogin) btnLogin.style.display = 'none';
                if (btnLoginMovil) btnLoginMovil.style.display = 'none';
                if (perfilIcon) perfilIcon.style.display = 'inline-block';
            } else {
                if (perfilIcon) perfilIcon.style.display = 'none';
            }

            // Renderizar ofertas
            renderizarOfertas();
            
            // Actualizar contador del carrito
            actualizarContadorCarrito();
            
            // Configurar menú móvil
            const menuIcon = document.querySelector('.menu-icon');
            const menuLateral = document.querySelector('.menu-lateral');
            
            if (menuIcon && menuLateral) {
                menuIcon.addEventListener('click', () => {
                    menuLateral.classList.toggle('visible');
                });
            }
        });
    </script>
    <script src="perfilLink.js"></script>
</body>
</html>
