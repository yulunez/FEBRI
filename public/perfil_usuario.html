<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="perfil_usuario.css">
    <link rel="stylesheet" href="editarperfil.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <title>Perfil de Usuario</title>
    <script>


        // Funcionalidad para los botones de corazón
        document.querySelectorAll('.boton-corazon-producto').forEach(boton => {
            boton.addEventListener('click', function() {
            });
        });

    </script>
</head>
<body>
 <!-- Encabezado con botón de cerrar sesión -->
    <div class="encabezado">
        <div class="contenido-encabezado">
            <div class="lado-izquierdo">
                <a href="index.html">
                    <svg class="boton-regresar" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="15,18 9,12 15,6"></polyline>
                    </svg>
                </a>
                <h1>Perfil</h1>
            </div>
            
            <!-- Botón de cerrar sesión -->
            <button class="boton-cerrar-sesion" onclick="cerrarSesion()">
                <i class='bx bx-log-out'></i>
                <span class="texto-cerrar">Cerrar Sesión</span>
            </button>
        </div>
    </div>
    

    <div class="contenedor">
        <!-- Tarjeta de Información del Usuario -->
        <div class="tarjeta-usuario">
            <div class="contenido-usuario">
                <!-- Imagen de Perfil -->
                <div class="imagen-perfil">
                    <div class="circulo-perfil">
                        <div class="interior-perfil">
                            <div class="avatar-perfil"></div>
                        </div>
                    </div>
                    <div class="insignia-perfil">
                        <svg class="icono-corazon" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                        </svg>
                    </div>
                </div>

                <!-- Detalles del Usuario -->
                    <div class="detalles-usuario">
                        <h2></h2>
                        <div class="info-usuario"></div>
                        <button class="boton-editar" id="btnEditar">Editar Perfil</button>
                    </div>
            </div>
        </div>

        <!-- Sección de Estadísticas -->
        <div class="cuadricula-estadisticas">
            <div class="tarjeta-estadistica">
                <div class="contenedor-icono-estadistica">
                    <svg class="icono-estadistica carrito" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="9" cy="21" r="1"></circle>
                        <circle cx="20" cy="21" r="1"></circle>
                        <path d="m1 1 4 4 16 2-8 8H8l-2-2"></path>
                        <path d="m16 8 1 1"></path>
                    </svg>
                </div>
               
                <div class="etiqueta-estadistica">Compras</div>
            </div>
            <div class="tarjeta-estadistica">
                <div class="contenedor-icono-estadistica">
                    <svg class="icono-estadistica camion" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect width="16" height="13" x="1" y="6" rx="2"></rect>
                        <path d="m17 6 4 4v7h-2"></path>
                        <circle cx="6" cy="19" r="2"></circle>
                        <circle cx="18" cy="19" r="2"></circle>
                    </svg>
                </div>
                <div class="etiqueta-estadistica">Envío</div>
            </div>
        </div>

        <!-- Sección de Contenido -->
        <div class="tarjeta-contenido">
            <!-- Encabezado de Pestaña -->
            <div class="encabezado-pestana">
                <button class="boton-pestana">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                    </svg>
                    Me gusta
                </button>
            </div>


            <!-- Modal flotante para editar información -->
<div id="modalEdit" class="modal-edit" style="display:none;">
    <form class="formEdit" id="formEdit" method="POST">
        <button type="button" class="close-modal-edit" id="closeModalEdit" title="Cerrar">&times;</button>
        
        <div class="logo-container">
            <img src="imagenes/logo.png" alt="Logo Febri" class="logo-registro">
            <h1 class="titulo-registro">Editar Perfil</h1>
        </div>

        <div class="fila-formulario">
            <div style="flex: 1; margin-right: -10px;">
                <input type="text" placeholder="Nuevo Nombre" class="entrada-mitad" id="nombre">
                <div class="mensaje-error" id="error-nombre"></div>
            </div>
            <div style="flex: 1; margin-left: 10px;">
                <input type="text" placeholder="Nuevo Apellido" class="entrada-mitad" id="apellidos">
            </div>
        </div>

        <div class="grupo-formulario">
            <div class="contenedor-icono">
                <i class='bx bxs-calendar'></i>
                <input type="date" class="control-formulario" id="fecha" required>
            </div>
        </div>

        <div class="grupo-formulario">
            <div class="contenedor-icono">
                <i class='bx bxs-map' id="icono-mapa" title="Clic para seleccionar en el mapa"></i>
                <input type="text" placeholder="Ingrese su nueva dirección" class="control-formulario" id="direccion">
            </div>
        </div>

        <div class="grupo-formulario">
            <div class="contenedor-icono">
                <i class='bx bxs-envelope'></i>
                <input type="email" placeholder="Ingresar nuevo correo electrónico" class="control-formulario" id="email">
            </div>
            <div class="mensaje-error" id="error-email"></div>
        </div>

        <div class="grupo-formulario">
            <div class="contenedor-icono">
                <i class='bx bxs-phone'></i>
                <input type="tel" placeholder="Ingresar nuevo teléfono" class="control-formulario" id="telefono">
            </div>
            <div class="mensaje-error" id="error-telefono"></div>
        </div>

        <button type="submit">Guardar Cambios</button>
    </form>
</div>
            <!-- Contenido -->
            <div class="seccion-contenido">
                <div class="encabezado-seccion">
                    <h3 class="titulo-seccion">Productos favoritos</h3>
                    <span class="contador-seccion">3 productos</span>
                </div>
                
                <div class="cuadricula-productos">
                    <div id="favoritos-grid"></div>
                </div>
            </div>
        </div>
    </div>

    <script>


    let usuarioActual = {};
    document.addEventListener('DOMContentLoaded', async function() {
        try {
            const res = await fetch('/perfilUsuario', { credentials: 'include' });
            const data = await res.json();
            if (data.success) {
                const usuario = data.usuario;
                usuarioActual = usuario;
                document.querySelector('.detalles-usuario h2').textContent = `${usuario.nombre}  ${usuario.apellido}`.trim() || 'Sin nombre';
                document.querySelector('.info-usuario').innerHTML = `
                    <p><span>Correo:</span> ${usuario.correo || ''}</p>
                    <p><span>Dirección:</span> ${usuario.direccion || ''}</p>
                    <p><span>Teléfono:</span> ${usuario.telefono || ''}</p>
                `;
            } else {
                window.location.href = 'login.html';
            }
        } catch (err) {
            console.error('Error al cargar perfil:', err);
        }

        // Cargar favoritos de la sesión y renderizarlos
        try {
            const resp = await fetch('/producto/favorito', { credentials: 'include' });
            if (resp.ok) {
                const body = await resp.json();
                if (body && body.success && Array.isArray(body.favoritos)) {
                    renderFavoritos(body.favoritos);
                }
            }
        } catch (e) {
            console.error('No se pudieron cargar favoritos:', e);
        }
    });

    function renderFavoritos(favs) {
        const grid = document.getElementById('favoritos-grid');
        grid.innerHTML = '';
        if (!favs || favs.length === 0) {
            grid.innerHTML = '<p>No tienes productos en favoritos.</p>';
            return;
        }
        favs.forEach(p => {
            const card = document.createElement('div');
            card.className = 'tarjeta-producto';
            card.innerHTML = `
                <div class="imagen-producto">
                    <img src="${p.imagen || 'imagenes/inicio.webp'}" alt="${(p.Nombre||p.nombre)||''}" class="img-producto">
                    <button class="boton-corazon-producto" data-id="${p.id}">
                        <svg class="icono-corazon-producto" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                        </svg>
                    </button>
                </div>
                <div class="info-producto">
                    <h3 class="nombre-producto">${p.Nombre || p.nombre || ''}</h3>
                    <p class="precio-producto">${p.Precio != null ? ('$ ' + p.Precio) : ''}</p>
                </div>
            `;
            grid.appendChild(card);
        });

        // attach remove handlers
        grid.querySelectorAll('.boton-corazon-producto').forEach(btn => {
            btn.addEventListener('click', async function(){
                const pid = this.getAttribute('data-id');
                if (!pid) return;
                try {
                    const res = await fetch(`/producto/favorito/${encodeURIComponent(pid)}`, { method: 'DELETE', credentials: 'include' });
                    if (!res.ok) throw new Error('Error al quitar favorito');
                    const body = await res.json();
                    if (body && body.success) {
                        renderFavoritos(body.favoritos || []);
                    }
                } catch (err) {
                    console.error('No se pudo quitar favorito:', err);
                    alert('No se pudo quitar de favoritos');
                }
            });
        });
    }

        // Funcionalidad para los botones de corazón
        document.querySelectorAll('.boton-corazon-producto').forEach(boton => {
            boton.addEventListener('click', function() {
                const iconoCorazon = this.querySelector('.icono-corazon-producto');
                // Toggle del estado de favorito
                if (iconoCorazon.style.opacity === '0.5') {
                    iconoCorazon.style.opacity = '1';
                    iconoCorazon.style.color = '#ec4899';
                } else {
                    iconoCorazon.style.opacity = '0.5';
                    iconoCorazon.style.color = '#9ca3af';
                }
            });
        });     
      
        
        function cerrarSesion() {

              // 🔹 Limpia el localStorage ANTES de hacer el fetch
                localStorage.removeItem('usuarioLogueado');
                localStorage.removeItem('nombreUsuario');
            fetch('/logout', {
                method: 'POST',
                credentials: 'include'
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    window.location.href = 'login.html';
                } else {
                    alert('Error al cerrar sesión');
                }
            })
            .catch(err => {
                console.error('Error al cerrar sesión:', err);
                alert('Error al cerrar sesión');
            });
        }

        // Mostrar el modal flotante al hacer click en editar
        document.getElementById("btnEditar").addEventListener("click", () =>{
            // Rellenar el formulario con los valores actuales
            document.getElementById("nombre").value = usuarioActual.nombre || "";
            document.getElementById("apellidos").value = usuarioActual.apellido || "";
            document.getElementById("email").value = usuarioActual.correo || "";
            document.getElementById("telefono").value = usuarioActual.telefono || "";
            document.getElementById("direccion").value = usuarioActual.direccion || "";
            document.getElementById("fecha").value = usuarioActual.fecha_nacimiento || "";
            document.getElementById("modalEdit").style.display = "flex";
        });

        // Cerrar el modal flotante al hacer click en el botón de cerrar
        document.getElementById("closeModalEdit").addEventListener("click", () =>{
            document.getElementById("modalEdit").style.display = "none";
        });

        // Cerrar el modal al enviar el formulario
        document.getElementById("formEdit").addEventListener("submit", function(e){
            e.preventDefault();
            // Tomar los valores del formulario, si están vacíos usar los originales
            const nombre = document.getElementById("nombre").value.trim() || usuarioActual.nombre;
            const apellidos = document.getElementById("apellidos").value.trim() || usuarioActual.apellido;
            const correo = document.getElementById("email").value.trim() || usuarioActual.correo;
            const telefono = document.getElementById("telefono").value.trim() || usuarioActual.telefono;
            const direccion = document.getElementById("direccion").value.trim() || usuarioActual.direccion;
            const fecha = document.getElementById("fecha").value.trim() || usuarioActual.fecha_nacimiento;

            // Enviar los datos al backend
            fetch(`/perfil/editar/${usuarioActual.id}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                credentials: 'include',
                body: JSON.stringify({ nombre, apellidos, correo, telefono, direccion, fecha })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    // Actualizar los datos en pantalla
                    document.querySelector('.detalles-usuario h2').textContent = `${nombre}  ${apellidos}`.trim() || 'Sin nombre';
                    document.querySelector('.info-usuario').innerHTML = `
                        <p><span>Correo:</span> ${correo || ''}</p>
                        <p><span>Dirección:</span> ${direccion || ''}</p>
                        <p><span>Teléfono:</span> ${telefono || ''}</p>
                    `;
                    // Actualizar usuarioActual
                    usuarioActual = { ...usuarioActual, nombre, apellido: apellidos, correo, telefono, direccion, fecha_nacimiento: fecha };
                } else {
                    alert('Error al actualizar el usuario');
                }
                document.getElementById("modalEdit").style.display = "none";
            })
            .catch(err => {
                alert('Error al actualizar el usuario');
                document.getElementById("modalEdit").style.display = "none";
            });
        });
    </script>



</body>
</html>
