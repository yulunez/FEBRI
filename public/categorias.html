<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>categorias febri</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="style.css">
</head>
<body>
      <!-- Barra de navegación para pantallas grandes -->
    <nav class="nav-grande">
        <div class="logo">
            <img src="imagenes/logo.png" alt="Logo">
        </div>
        <div class="barra-busqueda">
            <input type="text" placeholder="Buscar productos en Febri...">
            <i class='bx bx-search'></i>
        </div>
        <div class="menu-items">
            <a href="index.html" class="nav-link">Inicio</a>
            <a href="categorias.html" class="nav-link">Categorías</a>
            <a href="ofertas.html" class="nav-link">Ofertas</a>
            <a href="contactos.html" class="nav-link">Contáctos</a>

            <div class="btn-registrar"><a href="login.html">Iniciar sesión</a></div>
                
                    <!-- Carrito de compras -->
            <div class="carrito-nav" onclick="irAlCarrito()">
                <i class='bx bx-cart'></i>
                <span class="contador-carrito" id="contador-carrito" style="display: none;">0</span>
            </div>
               <a href="perfil_usuario.html"><i class='bx bx-user perfil-icon'></i></a> 
                
        </div>
        </div>

    </nav>


    <!-- Menú móvil para pantallas pequeñas -->
    <nav class="nav-pequeno">
        <div class="menu-superior">
            <div class="menu-izquierda">
                <i class='bx bx-menu menu-icon'></i>
                <div class="barra-busqueda-movil">
                    <input type="text" placeholder="Buscar productos en Febri...">
                    <i class='bx bx-search'></i>
                </div>
            </div>
            
            <div class="menu-superior-derecha">
               
                       <!-- Carrito de compras -->
            <div class="carrito-nav" onclick="irAlCarrito()">
                <i class='bx bx-cart'></i>
                <span class="contador-carrito" id="contador-carrito" style="display: none;">0</span>
            </div>
               <a href="perfil_usuario.html"><i class='bx bx-user perfil-icon'></i></a> 
                
        </div>
        </div>
        <!-- Menú lateral -->
        <div class="menu-lateral">
            <div class="menu-items-movil">
                <a href="index.html" class="nav-link-movil">
                    <i class='bx bx-home-alt'></i>
                    <span>Inicio</span>
                </a>
                <a href="contactos.html" class="nav-link-movil">
                    <i class='bx bx-phone'></i>
                    <span>Contáctos</span>
                </a>
                <a href="categorias.html" class="nav-link-movil">
                    <i class='bx bx-category'></i>
                    <span>Categorías</span>
                </a>
                <a href="ofertas.html" class="nav-link-movil">
                    <i class='bx bx-gift'></i>
                    <span>Ofertas</span>
                </a>
            </div>
        </div>
    </nav>

    <section class="categorias">
        <h2 class="categorias-titulo">Nuestras Categorías</h2>
        <div class="categorias-contenedor">
            <a href="categoria_ind.html" class="categoria-tarjeta">
                <div class="categoria-imagen">
                    <img src="" alt="">
                </div>
                <h3 class="categoria-nombre"></h3>
            </a>

        </div>
    </section>
    <script src="script.js"></script>
    <script>
    (async function(){
        const contenedor = document.querySelector('.categorias-contenedor');
        contenedor.innerHTML = '';
        try{
            const res = await fetch('/categorias');
            const data = await res.json();
            if (!data || !data.success || !Array.isArray(data.categorias) || data.categorias.length === 0) {
                contenedor.innerHTML = '<p>No hay categorías disponibles.</p>';
                return;
            }

            data.categorias.forEach(categoria => {
                const categoriaTarjeta = document.createElement('a');
                // Enlace con query param que contiene el ID de la categoría
                const catId = categoria.id || categoria.ID_categoria || categoria.ID || '';
                categoriaTarjeta.href = `categoria_ind.html?id=${encodeURIComponent(catId)}`;
                categoriaTarjeta.className = 'categoria-tarjeta';
                categoriaTarjeta.innerHTML = `
                    <div class="categoria-imagen">
                        <img src="${categoria.Imagen || categoria.imagen || ''}" alt="${categoria.nombre || categoria.Nombre || ''}">
                    </div>
                    <h3 class="categoria-nombre">${categoria.nombre || categoria.Nombre || ''}</h3>
                `;
                contenedor.appendChild(categoriaTarjeta);
            });

        }catch(err){
            console.error('Error cargando categorias:', err);
            contenedor.innerHTML = '<p>Error cargando categorías.</p>';
        }
    })();
    </script>
    
</body>
</html>
