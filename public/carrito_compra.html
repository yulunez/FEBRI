<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito de Compras - Productos de Resina</title>
     <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="carrito.css">
   
</head>
<body>
    <div class="carrito-container">
       <!-- Barra de navegación para pantallas grandes -->
    <nav class="nav-grande">
        <div class="logo">
            <img src="imagenes/logo.png" alt="Logo">
        </div>
        <div class="barra-busqueda">
            <input type="text" placeholder="Buscar productos en Febri...">
            <i class='bx bx-search'></i>
        </div>
            <div class="menu-items">
            <a href="index.html" class="nav-link">Inicio</a>
            <a href="categorias.html" class="nav-link">Categorías</a>
            <a href="ofertas.html" class="nav-link">Ofertas</a>
            <a href="contactos.html" class="nav-link">Contáctos</a>
            <div class="btn-registrar"><a href="login.html">Iniciar sesión</a></div>
                <a href="perfil_usuario.html"><i class='bx bx-user perfil-icon'></i></a>
                
        </div>
    </nav>

    <!-- Menú móvil para pantallas pequeñas -->
    <nav class="nav-pequeno">
        <div class="menu-superior">
            <div class="menu-izquierda">
                <i class='bx bx-menu menu-icon'></i>
                <div class="barra-busqueda-movil">
                    <input type="text" placeholder="Buscar productos en Febri...">
                    <i class='bx bx-search'></i>
                </div>
            </div>
            
            <div class="menu-superior-derecha">
        
                <div class="btn-registrar-movil">
                    <a href="login.html">Iniciar</a>
                </div>

                  <!-- Carrito de compras -->
            <div class="carrito-nav" onclick="irAlCarrito()">
                <i class='bx bx-cart'></i>
                <span class="contador-carrito" id="contador-carrito" style="display: none;">0</span>
            </div>
               <a href="perfil_usuario.html"><i class='bx bx-user perfil-icon'></i></a> 
                
        </div>
        </div>
        
        <!-- Menú lateral -->
        <div class="menu-lateral">
            <div class="menu-items-movil">
                <a href="inicio.html" class="nav-link-movil">
                    <i class='bx bx-home-alt'></i>
                    <span>Inicio</span>
                </a>
                <a href="contactos.html" class="nav-link-movil">
                    <i class='bx bx-phone'></i>
                    <span>Contáctos</span>
                </a>
                <a href="categorias.html" class="nav-link-movil">
                    <i class='bx bx-category'></i>
                    <span>Categorías</span>
                </a>
                <a href="ofertas.html" class="nav-link-movil">
                    <i class='bx bx-gift'></i>
                    <span>Ofertas</span>
                </a>
            </div>
        </div>
    </nav>
        <div class="carrito-body">
            <div id="productos-carrito">
    
            </div>

            <div id="carrito-vacio" class="carrito-vacio" style="display: none;">
                <div class="carrito-vacio-icon">🛒</div>
                <h3>Tu carrito está vacío</h3>
                <p>Agrega algunos productos de resina para continuar con tu compra</p>
            </div>
        </div>

        <div class="total-section" id="total-section">
            <div class="botones-total-container">
                <button class="btn-accion btn-comprar" onclick="comprar()">
                     Comprar Ahora
                </button>
                <div class="total-info">
                    <span class="total-label">Total a pagar:</span>
                    <div class="total-precio" id="total-precio">$0</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de confirmación -->
    <div class="modal" id="modal-confirmacion">
        <div class="modal-content">
            <div class="checkmark">✓</div>
            <p style="margin-top: 20px;"><strong>Total pagado: <span id="total-modal">$0</span></strong></p>
        </div>
    </div>

    <script>
        // Variable para almacenar los productos mostrados en el carrito (cada ítem incluye detalles del producto)
        let productosCarrito = [];

        // --- Interacción con el servidor ---
        // Obtener el carro desde la sesión en el servidor: GET /carro -> { carro: { productoId: cantidad, ... } }
        async function fetchCarroFromServer() {
            try {
                const res = await fetch('/carro', { credentials: 'include' });
                if (!res.ok) {
                    console.warn('No se pudo obtener carro del servidor, usando sessionStorage fallback');
                    return null;
                }
                const data = await res.json();
                return data.carro || {};
            } catch (err) {
                console.warn('Error de red al obtener carro del servidor:', err);
                return null;
            }
        }

        // Llamar al endpoint para sumar/al setear cantidad relativaa: POST /carro/agregar { productoId, cantidad }
        async function postAgregarAlCarro(productoId, cantidad) {
            try {
                const res = await fetch('/carro/agregar', {
                    method: 'POST',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ productoId: String(productoId), cantidad: Number(cantidad) })
                });
                if (!res.ok) {
                    const txt = await res.text();
                    throw new Error(txt || ('HTTP ' + res.status));
                }
                return await res.json();
            } catch (err) {
                console.error('Error agregando al carro:', err);
                throw err;
            }
        }

        // Llamar al endpoint para eliminar un producto del carro: POST /carro/eliminar { productoId }
        async function postEliminarDelCarro(productoId) {
            try {
                const res = await fetch('/carro/eliminar', {
                    method: 'POST',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ productoId: String(productoId) })
                });
                if (!res.ok) {
                    const txt = await res.text();
                    throw new Error(txt || ('HTTP ' + res.status));
                }
                return await res.json();
            } catch (err) {
                console.error('Error eliminando del carro:', err);
                throw err;
            }
        }

    // Indica si el servidor respondió correctamente cuando cargamos el carro
    let serverAvailable = false;

        // Formatear precio en pesos colombianos
        function formatearPrecio(precio) {
            return new Intl.NumberFormat('es-CO', {
                style: 'currency',
                currency: 'COP',
                minimumFractionDigits: 0
            }).format(precio);
        }

        // Renderizar productos del carrito (productosCarrito debe contener detalles de producto)
        function renderizarCarrito() {
            const contenedor = document.getElementById('productos-carrito');
            const carritoVacio = document.getElementById('carrito-vacio');
            const totalSection = document.getElementById('total-section');
            
            if (!Array.isArray(productosCarrito) || productosCarrito.length === 0) {
                contenedor.innerHTML = '';
                carritoVacio.style.display = 'block';
                totalSection.style.display = 'none';
                return;
            }

            carritoVacio.style.display = 'none';
            totalSection.style.display = 'block';

            contenedor.innerHTML = productosCarrito.map(producto => 
                '<div class="producto-item">' +
                    '<div class="producto-content">' +
                        '<img src="' + (producto.imagen || '') + '" alt="' + (producto.nombre || '') + '" class="producto-imagen">' +
                        '<div class="producto-details">' +
                            '<div class="producto-header">' +
                                '<div class="producto-info">' +
                                    '<h3>' + (producto.nombre || '') + '</h3>' +
                                    '<div class="producto-precio">' + formatearPrecio(producto.precio || 0) + ' </div>' +
                                '</div>' +
                                '<button class="btn-eliminar" data-id="' + producto.id + '" title="Eliminar producto">' +
                                    '<i class="bx bx-trash"></i>' +
                                '</button>' +
                            '</div>' +
                            '<div class="producto-descripcion">' + (producto.descripcion || 'Producto de resina artesanal de alta calidad') + '</div>' +
                            '<div class="cantidad-section">' +
                                '<div class="cantidad-controls">' +
                                    '<button class="btn-cantidad btn-decrease" data-id="' + producto.id + '" ' + (producto.cantidad <= 1 ? 'disabled' : '') + '>-</button>' +
                                    '<span class="cantidad">' + producto.cantidad + '</span>' +
                                    '<button class="btn-cantidad btn-increase" data-id="' + producto.id + '">+</button>' +
                                '</div>' +
                                '<div class="subtotal">Subtotal: ' + formatearPrecio((producto.precio || 0) * producto.cantidad) + '</div>' +
                            '</div>' +
                        '</div>' +
                    '</div>' +
                '</div>'
            ).join('');

            // Attach event handlers for dynamic buttons (optimistic UI)
            document.querySelectorAll('.btn-eliminar').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    const id = btn.getAttribute('data-id');
                    if (!id) return;
                    if (!confirm('¿Estás seguro de que quieres eliminar este producto del carrito?')) return;
                    // optimistic remove
                    const index = productosCarrito.findIndex(p => String(p.id) === String(id));
                    if (index === -1) return;
                    const removed = productosCarrito.splice(index, 1)[0];
                    renderizarCarrito();
                    try {
                        if (serverAvailable) {
                            await postEliminarDelCarro(id);
                            // server is source-of-truth; clear legacy local cache so it won't be re-synced
                            try { sessionStorage.removeItem('carritoCompra'); } catch (e) { /* ignore */ }
                            // sync to server state
                            await cargarYRenderizarCarrito();
                        } else {
                            // fallback: update local storage
                            guardarCarritoEnStorage();
                        }
                    } catch (err) {
                        // revert on failure
                        productosCarrito.splice(index, 0, removed);
                        renderizarCarrito();
                        alert('No se pudo eliminar el producto. Revisa la consola.');
                    }
                });
            });

            document.querySelectorAll('.btn-increase').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    const id = btn.getAttribute('data-id');
                    if (!id) return;
                    const p = productosCarrito.find(x => String(x.id) === String(id));
                    if (!p) return;
                    // optimistic increment
                    p.cantidad = (Number(p.cantidad) || 0) + 1;
                    renderizarCarrito();
                    try {
                        if (serverAvailable) {
                            await postAgregarAlCarro(id, 1);
                            // clear local cache -- server reflects the authoritative state
                            try { sessionStorage.removeItem('carritoCompra'); } catch (e) { /* ignore */ }
                            await cargarYRenderizarCarrito();
                        } else {
                            guardarCarritoEnStorage();
                        }
                    } catch (err) {
                        // revert
                        p.cantidad = Math.max((Number(p.cantidad) || 1) - 1, 0);
                        renderizarCarrito();
                        alert('No se pudo aumentar la cantidad. Revisa la consola.');
                    }
                });
            });

            document.querySelectorAll('.btn-decrease').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    const id = btn.getAttribute('data-id');
                    if (!id) return;
                    const pIndex = productosCarrito.findIndex(x => String(x.id) === String(id));
                    if (pIndex === -1) return;
                    const p = productosCarrito[pIndex];
                    // optimistic decrement
                    p.cantidad = (Number(p.cantidad) || 0) - 1;
                    let removed = null;
                    if (p.cantidad <= 0) {
                        removed = productosCarrito.splice(pIndex, 1)[0];
                    }
                    renderizarCarrito();
                    try {
                        if (serverAvailable) {
                            await postAgregarAlCarro(id, -1);
                            // if server reports zero we may need to call delete; cargarYRenderizarCarrito will sync
                            try { sessionStorage.removeItem('carritoCompra'); } catch (e) { /* ignore */ }
                            await cargarYRenderizarCarrito();
                        } else {
                            guardarCarritoEnStorage();
                        }
                    } catch (err) {
                        // revert
                        if (removed) {
                            productosCarrito.splice(pIndex, 0, removed);
                        } else {
                            p.cantidad = (Number(p.cantidad) || 0) + 1;
                        }
                        renderizarCarrito();
                        alert('No se pudo disminuir la cantidad. Revisa la consola.');
                    }
                });
            });

            actualizarTotales();
        }

        // Nota: las cantidades ahora se actualizan en el servidor

        // eliminarProducto -> ahora pide al servidor eliminar y recarga el carrito

        // Actualizar totales y contador (desde productosCarrito ya poblado con detalles)
        function actualizarTotales() {
            const totalItems = productosCarrito.reduce((total, producto) => total + (Number(producto.cantidad) || 0), 0);
            const totalPrecio = productosCarrito.reduce((total, producto) => total + ((Number(producto.precio) || 0) * (Number(producto.cantidad) || 0)), 0);

            const contadorElement = document.getElementById('contador-items');
            if (contadorElement) {
                contadorElement.textContent = totalItems;
            }
            document.getElementById('total-precio').textContent = formatearPrecio(totalPrecio);
            // Also update modal total if visible
            const totalModal = document.getElementById('total-modal');
            if (totalModal) totalModal.textContent = formatearPrecio(totalPrecio);
        }

        // Realizar compra - la sesión del servidor ya contiene el carro; redirigir a pago
        async function comprar() {
            // Fetch server carro to ensure there's content
            const serverCarro = await fetchCarroFromServer();
            const hasItems = serverCarro && Object.keys(serverCarro).length > 0;
            if (!hasItems && (!Array.isArray(productosCarrito) || productosCarrito.length === 0)) {
                alert('No hay productos en el carrito');
                return;
            }

            // Calculate total server-side expects numeric total; derive from productosCarrito
            const totalPrecio = productosCarrito.reduce((total, producto) => total + ((Number(producto.precio) || 0) * (Number(producto.cantidad) || 0)), 0);

            try {
                const res = await fetch('/compras', {
                    method: 'POST',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ total: totalPrecio })
                });
                if (!res.ok) {
                    const txt = await res.text();
                    throw new Error(txt || ('HTTP ' + res.status));
                }
                const data = await res.json();
                console.log('Response /compras:', data);
                if (data && data.success) {
                    // show confirmation modal with total
                    const modal = document.getElementById('modal-confirmacion');
                    const totalModal = document.getElementById('total-modal');
                    if (totalModal) totalModal.textContent = formatearPrecio(totalPrecio);
                    if (modal) modal.style.display = 'block';
                    // clear local cache and refresh UI
                    try { sessionStorage.removeItem('carritoCompra'); } catch (e) { /* ignore */ }
                    await cargarYRenderizarCarrito();
                } else {
                    alert((data && data.mensaje) ? data.mensaje : 'Error al procesar la compra');
                }
            } catch (err) {
                console.error('Error realizando compra:', err);
                alert('No se pudo completar la compra. Revisa la consola.');
            }
        }

        // Cerrar modal al hacer clic fuera
        const modal = document.getElementById('modal-confirmacion');
        if (modal) {
            modal.addEventListener('click', function(e) {
                if (e.target === this) {
                    this.style.display = 'none';
                }
            });
        }

        // Nota: sessionStorage es por pestaña/ventana y no se sincroniza entre pestañas.
        // Por eso no hay listener de 'storage' aquí. Si necesitas sincronizar entre
        // pestañas se debe usar localStorage o una solución basada en servidor.
        function escucharCambiosStorage() {
            // No-op para sesión por pestaña
        }

        // Helper: cargar el carro desde el servidor, obtener detalles de productos y renderizar
        async function cargarYRenderizarCarrito() {
            const serverCarro = await fetchCarroFromServer();
            // Mark whether server responded so optimistic handlers choose the server path
            serverAvailable = serverCarro !== null;
            console.log('Server available:', serverAvailable, 'serverCarro:', serverCarro);
            // Fallback: si servidor no responde, intentar sessionStorage local (compatibilidad)
            if (!serverCarro) {
                const carritoStorage = sessionStorage.getItem('carritoCompra');
                if (carritoStorage) {
                    try {
                        productosCarrito = JSON.parse(carritoStorage);
                    } catch (e) {
                        console.warn('No se pudo parsear carrito local:', e);
                        productosCarrito = [];
                    }
                } else {
                    productosCarrito = [];
                }
                renderizarCarrito();
                return;
            }

            const ids = Object.keys(serverCarro || {});
            if (ids.length === 0) {
                // If server has no items but the client has items stored in sessionStorage (legacy behavior
                // from other pages), sync them to the server so the session on server reflects the user's
                // cart across pages.
                const carritoStorage = sessionStorage.getItem('carritoCompra');
                if (carritoStorage) {
                    try {
                        const localItems = JSON.parse(carritoStorage);
                        if (Array.isArray(localItems) && localItems.length > 0) {
                            // send each item to server
                            await Promise.all(localItems.map(it => postAgregarAlCarro(it.id, Number(it.cantidad) || 1).catch(() => null)));
                            // refetch server carro after syncing
                            const newServerCarro = await fetchCarroFromServer();
                            // rebuild ids and continue
                            const newIds = Object.keys(newServerCarro || {});
                            if (newIds.length === 0) {
                                productosCarrito = [];
                                renderizarCarrito();
                                return;
                            }
                            // replace ids for subsequent processing
                            ids.length = 0; ids.push(...newIds);
                        } else {
                            productosCarrito = [];
                            renderizarCarrito();
                            return;
                        }
                    } catch (e) {
                        console.warn('No se pudo sincronizar carrito local al servidor:', e);
                        productosCarrito = [];
                        renderizarCarrito();
                        return;
                    }
                } else {
                    productosCarrito = [];
                    renderizarCarrito();
                    return;
                }
            }

            // obtener detalles de cada producto desde /producto/:id en paralelo
            const detailPromises = ids.map(id => fetch(`/producto/${encodeURIComponent(id)}`)
                .then(r => r.ok ? r.json() : null).catch(() => null));

            const details = await Promise.all(detailPromises);
            productosCarrito = [];
            for (let i = 0; i < ids.length; i++) {
                const id = ids[i];
                const qty = Number(serverCarro[id]) || 0;
                const det = details[i];
                if (det && det.success && det.producto) {
                    const p = det.producto;
                    productosCarrito.push({
                        id: String(id),
                        nombre: p.Nombre || p.nombre || '',
                        precio: Number(p.Precio || p.precio || 0),
                        imagen: p.Imagen || p.imagen || '',
                        descripcion: p.Descripcion || p.descripcion || '',
                        cantidad: qty
                    });
                } else {
                    // No se pudo obtener detalles; crear un placeholder mínimo
                    productosCarrito.push({ id: String(id), nombre: ('Producto ' + id), precio: 0, imagen: '', descripcion: '', cantidad: qty });
                }
            }
            renderizarCarrito();
        }

        // Inicialización cuando se carga la página
        document.addEventListener('DOMContentLoaded', async function() {
            // Configurar menú móvil
            const menuIcon = document.querySelector('.menu-icon');
            const menuLateral = document.querySelector('.menu-lateral');
            
            if (menuIcon && menuLateral) {
                menuIcon.addEventListener('click', function() {
                    menuLateral.classList.toggle('activo');
                });
            }

            // Cargar y mostrar productos del carrito desde servidor y renderizar
            await cargarYRenderizarCarrito();
            // escucharCambiosStorage() es no-op para sessionStorage

            console.log('Carrito cargado:', productosCarrito); // Para debugging
        });

        // Función adicional para limpiar todo el carrito (opcional) - ahora usa servidor
        async function limpiarCarrito() {
            if (!confirm('¿Estás seguro de que quieres eliminar todos los productos del carrito?')) return;
            const serverCarro = await fetchCarroFromServer();
            if (!serverCarro) {
                // fallback local
                productosCarrito = [];
                sessionStorage.removeItem('carritoCompra');
                renderizarCarrito();
                return;
            }
            const ids = Object.keys(serverCarro || {});
            await Promise.all(ids.map(id => postEliminarDelCarro(id).catch(() => null)));
            await cargarYRenderizarCarrito();
        }

        // Compatibilidad: si algún código llama a guardarCarritoEnStorage, mantener la función (no-op si servidor)
        function guardarCarritoEnStorage() {
            try { sessionStorage.setItem('carritoCompra', JSON.stringify(productosCarrito)); } catch (e) { /* ignore */ }
        }

        //ocultar boton de inicio de sesion despues de haver iniciado sesion
document.addEventListener('DOMContentLoaded', () => {
  const btnLogin = document.querySelector('.btn-registrar');
  const perfilIcon = document.querySelector('.perfil-icon');

  if (localStorage.getItem('usuarioLogueado') === 'true') {
    if (btnLogin) btnLogin.style.display = 'none';
    if (perfilIcon) perfilIcon.style.display = 'inline-block';
  } else {
    if (btnLogin) btnLogin.style.display = 'block';
    if (perfilIcon) perfilIcon.style.display = 'none';
  }
});
    </script>
</body>
