<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito de Compras - Productos de Resina</title>
     <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="carrito.css">
   
</head>
<body>
    <div class="carrito-container">
       <!-- Barra de navegación para pantallas grandes -->
    <nav class="nav-grande">
        <div class="logo">
            <img src="imagenes/logo.png" alt="Logo">
        </div>
        <div class="barra-busqueda">
            <input type="text" placeholder="Buscar productos en Febri...">
            <i class='bx bx-search'></i>
        </div>
        <div class="menu-items">
            <a href="index.html" class="nav-link">Inicio</a>
            <a href="categorias.html" class="nav-link">Categorías</a>
            <a href="ofertas.html" class="nav-link">Ofertas</a>
            <a href="contactos.html" class="nav-link">Contáctos</a>
            <div class="btn-registrar"><a href="iniciar_seccion.html">Iniciar sesión</a></div>
                <i class='bx bx-user perfil-icon'></i>
                
        </div>
    </nav>

    <!-- Menú móvil para pantallas pequeñas -->
    <nav class="nav-pequeno">
        <div class="menu-superior">
            <div class="menu-izquierda">
                <i class='bx bx-menu menu-icon'></i>
                <div class="barra-busqueda-movil">
                    <input type="text" placeholder="Buscar productos en Febri...">
                    <i class='bx bx-search'></i>
                </div>
            </div>
            
            <div class="menu-superior-derecha">
               
                <!-- Carrito de compras móvil -->
                <div class="carrito-nav" onclick="irAlCarrito()">
                    <i class='bx bx-cart'></i>
                    <span class="contador-carrito" id="contador-carrito-movil" style="display: none;">0</span>
                </div>
                <i class='bx bx-user perfil-icon'></i>
            </div>
        </div>
        
        <!-- Menú lateral -->
        <div class="menu-lateral">
            <div class="menu-items-movil">
                <a href="inicio.html" class="nav-link-movil">
                    <i class='bx bx-home-alt'></i>
                    <span>Inicio</span>
                </a>
                <a href="contactos.html" class="nav-link-movil">
                    <i class='bx bx-phone'></i>
                    <span>Contáctos</span>
                </a>
                <a href="categorias.html" class="nav-link-movil">
                    <i class='bx bx-category'></i>
                    <span>Categorías</span>
                </a>
                <a href="ofertas.html" class="nav-link-movil">
                    <i class='bx bx-gift'></i>
                    <span>Ofertas</span>
                </a>
            </div>
        </div>
    </nav>
        <div class="carrito-body">
            <div id="productos-carrito">
    
            </div>

            <div id="carrito-vacio" class="carrito-vacio" style="display: none;">
                <div class="carrito-vacio-icon">🛒</div>
                <h3>Tu carrito está vacío</h3>
                <p>Agrega algunos productos de resina para continuar con tu compra</p>
            </div>
        </div>

        <div class="total-section" id="total-section">
            <div class="botones-total-container">
                <button class="btn-accion btn-comprar" onclick="comprar()">
                     Comprar Ahora
                </button>
                <div class="total-info">
                    <span class="total-label">Total a pagar:</span>
                    <div class="total-precio" id="total-precio">$0</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de confirmación -->
    <div class="modal" id="modal-confirmacion">
        <div class="modal-content">
            <div class="checkmark">✓</div>
            <p style="margin-top: 20px;"><strong>Total pagado: <span id="total-modal">$0</span></strong></p>
        </div>
    </div>

    <script>
        // Variable para almacenar los productos del carrito (ahora se carga desde localStorage)
        let productosCarrito = [];

        // Cargar productos del carrito desde localStorage
        function cargarCarritoDesdeStorage() {
            const carritoStorage = localStorage.getItem('carritoCompra');
            if (carritoStorage) {
                try {
                    productosCarrito = JSON.parse(carritoStorage);
                } catch (error) {
                    console.error('Error al cargar carrito:', error);
                    productosCarrito = [];
                }
            } else {
                productosCarrito = [];
            }
        }

        // Guardar productos del carrito en localStorage
        function guardarCarritoEnStorage() {
            localStorage.setItem('carritoCompra', JSON.stringify(productosCarrito));
        }

        // Formatear precio en pesos colombianos
        function formatearPrecio(precio) {
            return new Intl.NumberFormat('es-CO', {
                style: 'currency',
                currency: 'COP',
                minimumFractionDigits: 0
            }).format(precio);
        }

        // Renderizar productos del carrito
        function renderizarCarrito() {
            const contenedor = document.getElementById('productos-carrito');
            const carritoVacio = document.getElementById('carrito-vacio');
            const totalSection = document.getElementById('total-section');
            
            if (productosCarrito.length === 0) {
                contenedor.innerHTML = '';
                carritoVacio.style.display = 'block';
                totalSection.style.display = 'none';
                return;
            }

            carritoVacio.style.display = 'none';
            totalSection.style.display = 'block';

            contenedor.innerHTML = productosCarrito.map(producto => 
                '<div class="producto-item">' +
                    '<div class="producto-content">' +
                        '<img src="' + producto.imagen + '" alt="' + producto.nombre + '" class="producto-imagen">' +
                        '<div class="producto-details">' +
                            '<div class="producto-header">' +
                                '<div class="producto-info">' +
                                    '<h3>' + producto.nombre + '</h3>' +
                                    '<div class="producto-precio">' + formatearPrecio(producto.precio) + ' </div>' +
                                '</div>' +
                                '<button class="btn-eliminar" onclick="eliminarProducto(' + producto.id + ')" title="Eliminar producto">' +
                                    '<i class="bx bx-trash"></i>' +
                                '</button>' +
                            '</div>' +
                            '<div class="producto-descripcion">' + (producto.descripcion || 'Producto de resina artesanal de alta calidad') + '</div>' +
                            '<div class="cantidad-section">' +
                                '<div class="cantidad-controls">' +
                                    '<button class="btn-cantidad" onclick="cambiarCantidad(' + producto.id + ', -1)" ' + (producto.cantidad <= 1 ? 'disabled' : '') + '>-</button>' +
                                    '<span class="cantidad">' + producto.cantidad + '</span>' +
                                    '<button class="btn-cantidad" onclick="cambiarCantidad(' + producto.id + ', 1)">+</button>' +
                                '</div>' +
                                '<div class="subtotal">Subtotal: ' + formatearPrecio(producto.precio * producto.cantidad) + '</div>' +
                            '</div>' +
                        '</div>' +
                    '</div>' +
                '</div>'
            ).join('');

            actualizarTotales();
        }

        // Cambiar cantidad de un producto
        function cambiarCantidad(productoId, cambio) {
            const producto = productosCarrito.find(p => p.id === productoId);
            if (producto) {
                const nuevaCantidad = producto.cantidad + cambio;
                if (nuevaCantidad >= 1) {
                    producto.cantidad = nuevaCantidad;
                    // Guardar cambios en localStorage
                    guardarCarritoEnStorage();
                    renderizarCarrito();
                }
            }
        }

        // Eliminar producto del carrito con animación
        function eliminarProducto(productoId) {
            if (confirm('¿Estás seguro de que quieres eliminar este producto del carrito?')) {
                // Encontrar el elemento del producto
                const productoElement = document.querySelector(`[onclick="eliminarProducto(${productoId})"]`).closest('.producto-item');
                
                // Agregar clase de animación si existe
                if (productoElement) {
                    productoElement.classList.add('eliminando');
                }
                
                // Esperar a que termine la animación antes de eliminar del array
                setTimeout(() => {
                    productosCarrito = productosCarrito.filter(p => p.id !== productoId);
                    // Guardar cambios en localStorage
                    guardarCarritoEnStorage();
                    renderizarCarrito();
                }, 300); // Reducido el tiempo para mejor UX
            }
        }

        // Actualizar totales y contador
        function actualizarTotales() {
            const totalItems = productosCarrito.reduce((total, producto) => total + producto.cantidad, 0);
            const totalPrecio = productosCarrito.reduce((total, producto) => total + (producto.precio * producto.cantidad), 0);

            const contadorElement = document.getElementById('contador-items');
            if (contadorElement) {
                contadorElement.textContent = totalItems;
            }
            document.getElementById('total-precio').textContent = formatearPrecio(totalPrecio);
        }

        // Realizar compra - Redirigir a página de pago
        function comprar() {
            if (productosCarrito.length === 0) {
                alert('No hay productos en el carrito');
                return;
            }

            // Calcular total
            const totalCompra = productosCarrito.reduce((sum, producto) => sum + (producto.precio * producto.cantidad), 0);

            // Guardar información para la página de pago
            localStorage.setItem('carritoCompra', JSON.stringify(productosCarrito));
            localStorage.setItem('totalCompra', totalCompra);

            // Redirigir a la página de pago
            window.location.href = 'pago.html';
        }

        // Cerrar modal al hacer clic fuera
        const modal = document.getElementById('modal-confirmacion');
        if (modal) {
            modal.addEventListener('click', function(e) {
                if (e.target === this) {
                    this.style.display = 'none';
                }
            });
        }

        // Función para escuchar cambios en localStorage (si se actualiza desde otra pestaña)
        function escucharCambiosStorage() {
            window.addEventListener('storage', function(e) {
                if (e.key === 'carritoCompra') {
                    cargarCarritoDesdeStorage();
                    renderizarCarrito();
                }
            });
        }

        // Inicialización cuando se carga la página
        document.addEventListener('DOMContentLoaded', function() {
            // Configurar menú móvil
            const menuIcon = document.querySelector('.menu-icon');
            const menuLateral = document.querySelector('.menu-lateral');
            
            if (menuIcon && menuLateral) {
                menuIcon.addEventListener('click', function() {
                    menuLateral.classList.toggle('activo');
                });
            }

            // Cargar y mostrar productos del carrito
            cargarCarritoDesdeStorage();
            renderizarCarrito();
            escucharCambiosStorage();

            console.log('Carrito cargado:', productosCarrito); // Para debugging
        });

        // Función adicional para limpiar todo el carrito (opcional)
        function limpiarCarrito() {
            if (confirm('¿Estás seguro de que quieres eliminar todos los productos del carrito?')) {
                productosCarrito = [];
                guardarCarritoEnStorage();
                renderizarCarrito();
            }
        }
    </script>
</body>
</html>
