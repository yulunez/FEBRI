<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar Contraseña</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="style.css">
</head>
<body class="body-inicio">
    <div class="contenedor-recuperar">
        <form class="caja-recuperar" id="formCambiar">
            <div class="logo-container">
                <img src="imagenes/logo.png" alt="Logo Febri" class="logo-login">
            </div>
            <h1 class="titulo-recuperar">Cambiar contraseña</h1>
            <p class="texto-instruccion" id="estadoToken">Validando enlace...</p>

            <div class="grupo-entrada">
                <label class="etiqueta">Nueva contraseña</label>
                <div class="campo-entrada">
                    <i class='bx bxs-lock-alt'></i>
                    <input type="password" id="nuevaPassword" class="entrada-texto" autocomplete="new-password" minlength="8" placeholder="Mínimo 8 caracteres">
                </div>
            </div>

            <div class="grupo-entrada">
                <label class="etiqueta">Confirmar contraseña</label>
                <div class="campo-entrada">
                    <i class='bx bxs-lock-alt'></i>
                    <input type="password" id="confirmarPassword" class="entrada-texto" autocomplete="new-password" minlength="8" placeholder="Repite la contraseña">
                </div>
            </div>

            <button type="submit" class="boton-enviar" id="btnCambiar" disabled>Cambiar contraseña</button>
            <div id="mensajeCambio" style="display:none; margin-top:12px;"></div>
        </form>
    </div>

    <script>
    (function() {
        const params = new URLSearchParams(window.location.search);
        const token = (params.get('token') || '').trim();

        const estadoToken = document.getElementById('estadoToken');
        const form = document.getElementById('formCambiar');
        const pass1 = document.getElementById('nuevaPassword');
        const pass2 = document.getElementById('confirmarPassword');
        const btn = document.getElementById('btnCambiar');
        const msg = document.getElementById('mensajeCambio');

        function mostrarMensaje(texto, color) {
            msg.textContent = texto;
            msg.style.display = 'block';
            msg.style.color = color || '#333';
        }

        async function validarToken() {
            if (!token) {
                estadoToken.textContent = 'Enlace inválido: falta el token.';
                btn.disabled = true;
                return;
            }
            try {
                const res = await fetch('/recuperar/validar?token=' + encodeURIComponent(token));
                const data = await res.json();
                if (data.valid) {
                    estadoToken.textContent = 'Token válido. Ingresa tu nueva contraseña.';
                    btn.disabled = false;
                } else {
                    estadoToken.textContent = data.message || 'El enlace de cambio no es válido.';
                    btn.disabled = true;
                }
            } catch (err) {
                console.error('Error validando token:', err);
                estadoToken.textContent = 'Error al validar el enlace.';
                btn.disabled = true;
            }
        }

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            msg.style.display = 'none';

            const p1 = pass1.value;
            const p2 = pass2.value;

            if (!p1 || !p2) {
                mostrarMensaje('Completa ambos campos.', '#c0392b');
                return;
            }
            if (p1.length < 8) {
                mostrarMensaje('La contraseña debe tener al menos 8 caracteres.', '#c0392b');
                return;
            }
            if (p1 !== p2) {
                mostrarMensaje('Las contraseñas no coinciden.', '#c0392b');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Guardando...';

            try {
                const res = await fetch('/recuperar/cambiar-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password: p1 })
                });
                const data = await res.json();
                if (data.success) {
                    mostrarMensaje('Contraseña actualizada correctamente. Redirigiendo a login...', '#2ecc71');
                    pass1.value = '';
                    pass2.value = '';
                    setTimeout(() => { window.location.href = 'login.html'; }, 1500);
                } else {
                    mostrarMensaje(data.message || 'No se pudo actualizar la contraseña.', '#c0392b');
                }
            } catch (err) {
                console.error('Error cambiando contraseña:', err);
                mostrarMensaje('Error del servidor. Inténtalo nuevamente.', '#c0392b');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Cambiar contraseña';
            }
        });

        validarToken();
    })();
    </script>
</body>
</html>
