<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Mis Envíos</title>
    <link rel="stylesheet" href="perfil_usuario.css"/>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <!-- Reutiliza botones/contador de Compras -->
    <link rel="stylesheet" href="compra.css">
    <!-- Estilos específicos de Envíos -->
    <link rel="stylesheet" href="envios.css">
    <style>
        .productos-envio {
            display: flex;
            gap: 0.5rem;
            padding: 1rem;
            overflow-x: auto;
            scrollbar-width: thin;
        }
        .producto-miniatura {
            position: relative;
            min-width: 70px;
            width: 70px;
            height: 70px;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #eee;
        }
        .producto-miniatura img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .cantidad-producto {
            position: absolute;
            top: 6px;
            right: 6px;
            background: #f8a4d8; /* rosa claro */
            color: white;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 800;
            box-shadow: 0 4px 8px rgba(0,0,0,0.12);
            border: 2px solid rgba(255,255,255,0.85);
            z-index: 12;
        }
    </style>
</head>
<body style="background:#f8fafc;">
    <div class="tarjeta-contenido" style="max-width:1024px;margin:2rem auto;">
        <div class="encabezado-seccion">
            <h3 class="titulo-seccion">Mis Envíos</h3>
            <span class="contador-seccion" id="contador-envios">0 envíos</span>
        </div>
        <div class="contenedor-envios" id="contenedor-envios">
            <!-- Barras de envío dinámicas -->
        </div>
    </div>

    <script>
    async function fetchEnvios() {
        try {
            const res = await fetch('/envios/usuario', { credentials: 'include' });
            if (!res.ok) throw new Error('Error al obtener envíos');
            const data = await res.json();
            return data.success ? data.envios : [];
        } catch (e) {
            console.error(e);
            return [];
        }
    }

    function crearBarraEnvio(envio) {
        const estadoClases = {
            'en_proceso': 'estado-en-proceso',
            'en_transito': 'estado-en-transito',
            'entregado': 'estado-entregado',
            'cancelado': 'estado-cancelado'
        };
        const estadoTextos = {
            'en_proceso': 'En proceso',
            'en_transito': 'En tránsito',
            'entregado': 'Entregado',
            'cancelado': 'Cancelado'
        };

        const productosHTML = (envio.productos || []).map(p => `
            <div class="producto-miniatura" title="${p.nombre}">
                <img src="${p.imagen || 'imagenes/producto-default.jpg'}" alt="${p.nombre || 'Producto'}"/>
                <div class="cantidad-producto">${p.cantidad}</div>
            </div>
        `).join('');

        let fechaEnvioHtml = '';
        if (envio.fechaEnvio) {
            const fechaLegible = new Date(envio.fechaEnvio).toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric' });
            fechaEnvioHtml = `<div class="fecha-envio">Enviado: ${fechaLegible}</div>`;
        } else {
            fechaEnvioHtml = `<div class="fecha-envio">En almacén</div>`;
        }

        // Stepper logic
        const rosa = '#f8a4d8';
        const gris = '#e5e7eb';
        // Estado de cada bolita
        const almacenActive = true;
        const enviadoActive = !!envio.fechaEnvio;
        const entregadoActive = !!envio.fechaEntrega;
        // Etiquetas
        const stepLabels = ['En almacén', 'Enviado', 'Entregado'];
        // Bolitas HTML
        const stepperHTML = `
            <div class="envio-stepper" style="display:flex;justify-content:center;align-items:center;margin:1.2rem 0 1.5rem 0;gap:2.5rem;">
                <div style="display:flex;flex-direction:column;align-items:center;gap:.3rem;">
                    <span style="width:32px;height:32px;border-radius:50%;background:${rosa};display:flex;align-items:center;justify-content:center;border:2px solid ${rosa};color:#fff;font-size:1.3rem;">
                        <i class='bx bx-check'></i>
                    </span>
                    <span style="font-size:.85rem;color:#f8a4d8;;margin-top:2px;">${stepLabels[0]}</span>
                </div>
                <div style="display:flex;flex-direction:column;align-items:center;gap:.3rem;">
                    <span style="width:32px;height:32px;border-radius:50%;background:${enviadoActive?rosa:gris};display:flex;align-items:center;justify-content:center;border:2px solid ${enviadoActive?rosa:gris};color:${enviadoActive?'#fff':'#888'};font-size:1.3rem;">
                        <i class='bx bx-check'></i>
                    </span>
                    <span style="font-size:.85rem;color:${enviadoActive?rosa:'#888'};margin-top:2px;">${stepLabels[1]}</span>
                </div>
                <div style="display:flex;flex-direction:column;align-items:center;gap:.3rem;">
                    <span style="width:32px;height:32px;border-radius:50%;background:${entregadoActive?rosa:gris};display:flex;align-items:center;justify-content:center;border:2px solid ${entregadoActive?rosa:gris};color:${entregadoActive?'#fff':'#888'};font-size:1.3rem;">
                        <i class='bx bx-check'></i>
                    </span>
                    <span style="font-size:.85rem;color:${entregadoActive?rosa:'#888'};margin-top:2px;">${stepLabels[2]}</span>
                </div>
            </div>
        `;

        // Decide display text and CSS class based on fechaEntrega presence
        const estadoDisplay = envio.fechaEntrega ? 'Terminado' : (estadoTextos[envio.estado] || 'En proceso');
        const estadoClass = envio.fechaEntrega ? 'estado-entregado' : (estadoClases[envio.estado] || 'estado-en-proceso');

        return `
            <div class="barra-envio">
                <div class="encabezado-envio">
                    <div class="info-envio-principal">
                        <div class="datos-envio">
                            <div class="numero-seguimiento">#${envio.numeroSeguimiento}</div>
                        </div>
                    </div>
                    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:.5rem;">
                        ${fechaEnvioHtml}
                        <span class="estado-envio ${estadoClass}">
                            ${estadoDisplay}
                        </span>
                    </div>
                </div>
                <div class="stepper-products-row" style="display:flex;align-items:center;gap:2rem;position:relative;">
                    <div class="productos-envio" style="margin:0;margin-right:auto;">${productosHTML}</div>
                    <div style="position:absolute;left:50%;transform:translateX(-50%);top:0;">${stepperHTML}</div>
                </div>
                <div class="detalles-envio">
                    <div class="direccion-envio"><strong>Destino:</strong> ${envio.direccionDestino || ''}</div>
                    <div class="total-envio">$${parseFloat(envio.costo || 0).toLocaleString('es-ES')}</div>
                    <div class="acciones-envio">
                        <button class="btn btn-envio" onclick="window.location.href='compras.html'">
                            <i class='bx bx-receipt'></i><span>Ver compras</span>
                        </button>
                    </div>
                </div>
            </div>
        `;
    }

    const urlParams = new URLSearchParams(window.location.search);
    const DEMO = urlParams.get('demo') === '1';
    
    // Envíos de ejemplo para modo demo
    function mockEnvios() {
        return [
            {
                id: 1205,
                numeroSeguimiento: 'ENV-1205',
                fechaEnvio: '2025-10-01',
                estado: 'en_transito',
                direccionDestino: 'Cra 10 # 20-30, Bogotá',
                costo: 35000,
                empresa: { nombre: 'Envíos Express', logo: 'imagenes/logo.png' },
                productos: [
                    { nombre: 'Llavero de K', imagen: 'imagenes/llavero-inicio.jpeg', cantidad: 1 },
                    { nombre: 'Jarrón moderno', imagen: 'imagenes/jarron.webp', cantidad: 2 }
                ]
            },
            {
                id: 1188,
                numeroSeguimiento: 'ENV-1188',
                fechaEnvio: '2025-09-28',
                estado: 'en_proceso',
                direccionDestino: 'Cl 45 # 8-12, Medellín',
                costo: 19000,
                empresa: { nombre: 'Logística Rápida', logo: 'imagenes/logo.png' },
                productos: [
                    { nombre: 'Cuadro decorativo', imagen: 'imagenes/decoracion-inicio.avif', cantidad: 1 }
                ]
            },
            {
                id: 1150,
                numeroSeguimiento: 'ENV-1150',
                fechaEnvio: '2025-09-20',
                estado: 'entregado',
                direccionDestino: 'Av 5 # 22-16, Cali',
                costo: 12000,
                empresa: { nombre: 'Courier Nacional', logo: 'imagenes/logo.png' },
                productos: [
                    { nombre: 'Collar pétalo', imagen: 'imagenes/joyas2.jpg', cantidad: 1 }
                ]
            }
        ];
    }

    async function renderizarEnvios() {
        const seccionContador = document.getElementById('contador-envios');
        const contenedor = document.getElementById('contenedor-envios');
    
        let envios = await fetchEnvios();
        if (!envios.length && DEMO) {
            envios = mockEnvios();
        }
    
        if (!envios.length) {
            seccionContador.textContent = '0 envíos';
            contenedor.innerHTML = `
                <div class="mensaje-sin-envios">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 9v4m0 4h.01M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/>
                    </svg>
                    <p>No tienes envíos en proceso.</p>
                </div>
            `;
            return;
        }
    
        seccionContador.textContent = `${envios.length} envío${envios.length !== 1 ? 's' : ''}`;
        contenedor.innerHTML = envios.map(crearBarraEnvio).join('');
    }

    document.addEventListener('DOMContentLoaded', renderizarEnvios);
    // Acción de copiar al portapapeles
    function copiarSeguimiento(numero) {
        if (!numero) return;
        navigator.clipboard.writeText(String(numero))
            .then(() => console.log('Número copiado:', numero))
            .catch(() => alert('No se pudo copiar el número'));
    }
    </script>
</body>
</html>
