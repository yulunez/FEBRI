<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="style.css">
</head>
<body class="body-inicio" >
    <div class="contenedor-recuperar">
        <form class="caja-recuperar">
            <h1 class="titulo-recuperar">Recuperar contraseña</h1>
            
            <p class="texto-instruccion">
                Proporciona tu correo electrónico en el campo
                luego te enviaremos un correo para que puedas
                cambiar tu contraseña
            </p>

            <div class="grupo-entrada">
                <label class="etiqueta">Correo electrónico</label>
                <div class="campo-entrada">
                    <i class='bx bxs-envelope'></i>
                    <input type="email" placeholder="ingrese el correo electrónico" class="entrada-texto">
                </div>
            </div>

            <button type="submit" class="boton-enviar">Enviar</button>
        </form>
    </div>
</body>
</html>
